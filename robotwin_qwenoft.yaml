#######
# RoboTwin QwenOFT baseline (chunk=50), AIDI job.
# 纯 VLA baseline（Qwen3-VL-4B 原生视觉 + MLP 动作头），按官方 6x8 OFT 启动脚本的训练规模对齐。
# Submit:
#   aidi-inf-cli job submit -f robotwin_qwenoft.yaml -q project-h20-horizon-labs-acloud
# Default scale: 6 workers x 8 GPUs = 48 GPUs (per_device 4 -> global batch 192).
#######
REQUIRED:
  JOB_NAME: "starvla-qwenoft-robotwin-h50-6x8"
  JOB_PASSWD: "newk8s666"

  UPLOAD_DIR: "/home/users/sen02.wang/workspace/starvla_dev"
  PROJECT_ID: "horizon-labs"

  WORKER_MIN_NUM: 6
  WORKER_MAX_NUM: 6
  GPU_PER_WORKER: 8

  RUN_SCRIPTS: "${WORKING_PATH}/run_aidi_rbtw.sh examples/Robotwin/train_files/starvla_qwenoft_robotwin.yaml"

OPTIONAL:
  FRAMEWORK: "pytorch"
  TASK_LABEL: "DEV"
  PRIORITY: 5
  DOCKER_IMAGE: "docker.hobot.cc/imagesys/starvla:v2.1"
  WALL_TIME: 20000
  JOB_TYPE: "train"
  REMARK: "RoboTwin QwenOFT baseline; Qwen3-VL-4B; chunk=50; robotwin_all_50; 6x8 H20"
  DATA_SPACE:
    DATA_TYPE: "dmp"
    INPUT: "robot_lab"
    OUTPUT: "robot_lab"
