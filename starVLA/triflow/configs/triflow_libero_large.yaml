# TriFlow 大模型配置 —— tower 按 ELF 模型阶梯放大到 ELF-M 档（Third_github/ELF）：
#   ELF-B: depth=12, hidden=768,  heads=12  ≈ 88M（triflow_libero.yaml 基线）
#   ELF-M: depth=24, hidden=1056, heads=16  ≈ 330M（本文件）
#   ELF-L: depth=32, hidden=1280, heads=16  ≈ 650M（需要再放大时改 tower 三行即可）
# 相对基线的非 tower 改动（均为随规模的常规调整，已注释说明）：
#   lr 1e-4→8e-5、warmup 2000→4000、步数 60k→100k、
#   per_device 32→16 + accum 2（全局 batch 仍 8GPU×256，控制激活显存）。
# 其余（flow 配方/任务表/数据）与基线一致；数据默认 libero_all 四套件合训。

run_id: triflow_libero_all_large
run_root_dir: playground/Debug_Checkpoints
seed: 42
wandb_entity: sanmumumu
wandb_project: starVLA_TriFlow
is_debug: false
version_id: "0.21"

framework:
  name: TriFlow
  # 单塔 from-scratch transformer（零 LLM/VLM；双向 SDPA + 4D additive mask；全程 fp32）
  tower:
    hidden_size: 1056              # ELF-M
    depth: 24                      # ELF-M
    num_heads: 16                  # ELF-M（head_dim=66）
    mlp_ratio: 4.0
    qk_norm: true
    dropout: 0.0
  # 语言模态：只用 BPE 分词文件 + 从头学的 embedding 表（紧凑词表）
  # d_text 是 flow 的 latent 维度，与 tower 宽度解耦；LIBERO 词表 ~78，256 维富余，无需随塔放大
  text:
    tokenizer_path: playground/Pretrained_models/Qwen2.5-0.5B
    vocab_mode: compact            # compact | full
    vocab_map_path: playground/Pretrained_models/triflow_assets/vocab_map_libero.json
    d_text: 256
    max_len: 32
  # 视觉模态：冻结 DINOv3-S（训练读离线 latents；eval server live 提特征）
  dino:
    name: dinov3_vits16
    hf_model_id: facebook/dinov3-vits16-pretrain-lvd1689m
    repo_or_dir: facebookresearch/dinov3
    weights: null
    loader: auto
    image_size: 224
    patch_size: 16
    embed_dim: 384
    n_patches: 196
    future_view_keys: ["video.primary_image", "observation.images.image", "primary_image", "agentview"]
    stats_path: null
    load_live_backbone: false
  # 动作模态（节点名保留 action_model：PolicyServerWrapper 靠它探测 chunk size）
  action_model:
    action_horizon: 8
    action_dim: 7
  # ELF 配方 flow matching（t=1 干净；网络预测 x0 → v=(x0_pred-z)/max(1-t,t_eps)）
  flow:
    t_eps: 0.05
    denoiser_p_mean: -1.5
    denoiser_p_std: 0.8
    noise_scale:
      vision: 2.0
      text: 2.0
      action: 1.0
    decoder_prob: 0.2              # L 为目标时：20% 概率走解码 CE 分支（ELF 双分支）
    decoder_p_mean: 0.8
    decoder_p_std: 0.8
    decoder_noise_scale: 2.0
    self_conditioning: false       # MVP 关；留开关
  losses:
    modality_weights:
      a: 1.0
      l: 1.0
      vf: 1.0
  sampling:
    method: ode                    # ode | sde
    sde_gamma: 1.0
    num_steps:
      action: 10
      text: 32
      future: 32
      joint: 32
  # 任务注册表：cond=干净块集合，target=加噪块集合；块名 ∈ {v, l, a, vf}
  tasks:
    attention_mask_neg_value: -1.0e4
    specs:
      policy:  {cond: [v, l],    target: [a]}
      v2l:     {cond: [v],       target: [l]}
      fdm:     {cond: [v, l, a], target: [vf]}
      passive: {cond: [v],       target: [vf]}
      idm:     {cond: [v, vf],   target: [a]}
      joint:   {cond: [v, l],    target: [a, vf]}
    weights:                       # 与基线当前实验口径一致（policy/v2l/joint）
      policy: 1.0
      v2l: 0.5
      fdm: 0.0
      passive: 0.0
      idm: 0.0
      joint: 0.5
  ema:
    enabled: true
    decay: 0.9999

datasets:
  vla_data:
    dataset_py: jointflow              # 数据管线整体复用 jointflow v1（build_joint_dataloader）
    data_root_dir: /mnt/hwdata/wangsen/starVLA/DATA/LEBERO/libero
    data_mix: libero_all               # 四套件合训（triflow/data/mixtures.py 运行期注册的别名）
    action_type: delta_qpos
    # 中文注释：LIBERO 的 lerobot `action` 本身已是 delta 控制量，必须 abs 透传，
    # 不能再用 action_mode=delta 二次差分（v1 血泪教训：roll→-π，eval 全 0% SR）。
    action_mode: abs
    action_horizon: 8
    world_model:
      future_stride: 8
    sequential_step_sampling: false
    include_state: false               # TriFlow：state 完全不输入
    # 中文注释：v1 joint_dataset 2026-06-10 起默认 online_dino=true（返回原始图像 image_0/1）。
    # TriFlow 走离线 latents 路径（dino_0/1），必须显式钉住 false。
    online_dino: false
    dino_feature_dir: latents
    dino_feature_layout: lingbot_episode
    dino_episode_cache_size: 2
    per_device_batch_size: 16          # 330M fp32 激活显存 ≈ 基线 2.75×；16+accum2 = 全局 256（8 GPU）
    load_all_data_for_training: true
    video_backend: torchvision_av
    num_workers: 8
    prefetch_factor: 2
    pin_memory: true
    persistent_workers: true

trainer:
  resume_from: null
  max_train_steps: 100000              # 大模型 + 四套件，多给训练预算（基线 60k）
  num_warmup_steps: 4000               # 随规模加倍 warmup，from-scratch 稳定性
  save_interval: 5000
  logging_frequency: 10
  task_loss_ema_beta: 0.98
  learning_rate:
    base: 8.0e-05                      # 比基线 1e-4 略降（宽度 768→1056 的常规缩放）
  lr_scheduler_type: constant_with_warmup
  scheduler_specific_kwargs: {}
  freeze_modules: ""
  loss_scale:
    vla: 1.0
  max_grad_norm: 1.0
  gradient_clipping: 1.0
  gradient_accumulation_steps: 2       # ×16 per_device = 全局 256（8 GPU）
  gradient_checkpointing: false        # tower 暂未实现重计算；330M fp32 b16 实测显存富余
  weight_decay: 0.0
  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 0.0
