######### // code // ##########
# 中文注释：TriFlow AIDI 任务模板（仿 starVLA/jointflow/job.yaml）。
# 提交一个新实验只改两处：
#   1) JOB_NAME      → triflow-<实验名>（与 experiments/ 下文件名对应，便于面板检索）
#   2) RUN_SCRIPTS   → 末尾的实验名参数（experiments/<实验名>.sh，不带 .sh）
# 若平台不支持 RUN_SCRIPTS 携带参数，则改 run_aidi.sh 顶部的 EXP 默认值。
######### // code // ##########
REQUIRED:
  JOB_NAME: "triflow-e001-libero-object-8gpu"
  JOB_PASSWD: "newk8s666"

  UPLOAD_DIR: "/home/users/sen02.wang-labs/aidi_jobs/starvla_dev"
  PROJECT_ID: "horizon-labs"

  WORKER_MIN_NUM: 1
  WORKER_MAX_NUM: 1
  GPU_PER_WORKER: 8

  # UPLOAD_DIR 是 starvla_dev，代码仓在 starvla_dev/starVLA；
  # 仓库内入口脚本固定为 starVLA/triflow/aidi/run_aidi.sh，最后一个参数 = 实验名。
  RUN_SCRIPTS: "${WORKING_PATH}/starVLA/starVLA/triflow/aidi/run_aidi.sh e001_libero_object_base"

OPTIONAL:
  FRAMEWORK: "pytorch"
  TASK_LABEL: "DEV"
  PRIORITY: 5
  DOCKER_IMAGE: "docker.hobot.cc/imagesys/starvla:v1.0"
  WALL_TIME: 20000
  JOB_TYPE: "train"
  REMARK: "triflow single-node 8gpu (零LLM/VLM 单塔全生成式 V/L/A)"
  DATA_SPACE:
    DATA_TYPE: "dmp"
    INPUT: "robot_lab"
    OUTPUT: "robot_lab"
