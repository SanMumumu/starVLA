######### // code // ##########
# 中文注释：RoboTwin DINOv3-L 离线 latent 预计算 AIDI job（H20 版）。
# 目标：project-h20-robot-lab-tcloud-bj 上 4 workers × 8 GPU = 32 进程，
# 按 robotwin_all 的 100 个 Clean/Randomized dataset 做 dataset-level 分片。
# H20 提速点（见 dino_precompute/dino_precompute.py）：
#   - bf16 autocast（latent 本来就存 bf16，几乎零精度损失）
#   - 后台预取线程把视频解码与 GPU 推理重叠，喂满显卡
#   - 大 batch（H20 96GB，DINO-L 用 256 很稳）
#   - 打印整 shard 的 ETA（frame/s、elapsed、eta）
# 提交：
#   aidi-inf-cli job submit \
#     -f starVLA/jointflow/dino_precompute/job_robotwin_32gpu_h20.yaml \
#     -q project-h20-robot-lab-tcloud-bj
######### // code // ##########
REQUIRED:
  JOB_NAME: "jointflow-precompute-robotwin-dinol-32gpu-h20"
  JOB_PASSWD: "newk8s666"

  UPLOAD_DIR: "/home/users/sen02.wang-labs/aidi_jobs/starvla_dev"
  PROJECT_ID: "horizon-labs"

  WORKER_MIN_NUM: 4
  WORKER_MAX_NUM: 4
  GPU_PER_WORKER: 8

  RUN_SCRIPTS: "JOINTFLOW_PRECOMPUTE_NUM_NODES=4 JOINTFLOW_PRECOMPUTE_GPUS_PER_WORKER=8 JOINTFLOW_PRECOMPUTE_BATCH_SIZE=256 JOINTFLOW_PRECOMPUTE_AMP_DTYPE=bf16 JOINTFLOW_PRECOMPUTE_PREFETCH=4 JOINTFLOW_PRECOMPUTE_CONFIG=starVLA/jointflow/configs/jointflow_robotwin_aidi.yaml JOINTFLOW_DATA_ROOT=/horizon-bucket/robot_lab/users/sen.wang-labs/starVLA/DATA/RoboTwin ${WORKING_PATH}/starVLA/starVLA/jointflow/dino_precompute/run_precompute_aidi.sh"

OPTIONAL:
  FRAMEWORK: "pytorch"
  TASK_LABEL: "DEV"
  PRIORITY: 5
  DOCKER_IMAGE: "docker.hobot.cc/imagesys/starvla:v1.0"
  WALL_TIME: 20000
  JOB_TYPE: "train"
  REMARK: "RoboTwin DINOv3-L latent precompute, 32 GPU H20, bf16+prefetch+ETA, output to per-dataset latents/"
  DATA_SPACE:
    DATA_TYPE: "dmp"
    INPUT: "robot_lab"
    OUTPUT: "robot_lab"
