# 中文注释：RoboTwin DINOv3-L 离线 latent 预计算 AIDI job。
# 目标：project-5090-robot-lab-bcloud-bj 上 8 workers × 8 GPU = 64 进程，
# 按 robotwin_all 的 100 个 Clean/Randomized dataset 做 dataset-level 分片。
######### // code // ##########
REQUIRED:
  JOB_NAME: "jointflow-precompute-robotwin-dinol-64gpu"
  JOB_PASSWD: "newk8s666"

  UPLOAD_DIR: "/home/users/sen02.wang-labs/aidi_jobs/starvla_dev"
  PROJECT_ID: "horizon-labs"

  WORKER_MIN_NUM: 8
  WORKER_MAX_NUM: 8
  GPU_PER_WORKER: 8

  RUN_SCRIPTS: "JOINTFLOW_PRECOMPUTE_NUM_NODES=8 JOINTFLOW_PRECOMPUTE_GPUS_PER_WORKER=8 JOINTFLOW_PRECOMPUTE_CONFIG=starVLA/jointflow/configs/jointflow_robotwin_aidi.yaml JOINTFLOW_DATA_ROOT=/horizon-bucket/robot_lab/users/sen.wang-labs/starVLA/DATA/RoboTwin ${WORKING_PATH}/starVLA/starVLA/jointflow/dino_precompute/run_precompute_aidi.sh"

OPTIONAL:
  FRAMEWORK: "pytorch"
  TASK_LABEL: "DEV"
  PRIORITY: 5
  DOCKER_IMAGE: "docker.hobot.cc/imagesys/starvla:v1.0"
  WALL_TIME: 20000
  JOB_TYPE: "train"
  REMARK: "RoboTwin DINOv3-L latent precompute, 64 GPU, output to per-dataset latents/"
  DATA_SPACE:
    DATA_TYPE: "dmp"
    INPUT: "robot_lab"
    OUTPUT: "robot_lab"
