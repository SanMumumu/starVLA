run_id: qwen_jointflow_libero_highscore_b24
run_root_dir: /horizon-bucket/robot_lab/users/sen.wang-labs/starVLA/outputs/starvla_jointflow
seed: 42
wandb_entity: sanmumumu
wandb_project: starVLA_JointFlow
is_debug: false
version_id: "0.21-highscore-b24"

framework:
  name: QwenJointFlow
  qwenvl:
    base_vlm: /horizon-bucket/robot_lab/users/sen.wang-labs/starVLA/CKPTS/Qwen2.5-0.5B
    attn_implementation: eager
    torch_dtype: float32
    fp32_forward: true
    vl_hidden_dim: 896
    max_text_length: 256
  dino:
    name: dinov3_vits16
    hf_model_id: facebook/dinov3-vits16-pretrain-lvd1689m
    repo_or_dir: facebookresearch/dinov3
    weights: null
    loader: auto
    image_size: 224
    patch_size: 16
    embed_dim: 384
    future_view_keys: ["video.primary_image", "observation.images.image", "primary_image", "agentview"]
    stats_path: null
    load_live_backbone: false
    dino_pool: 1
  state:
    inject_mode: token
    n_state_tokens: 1
    state_dim: 8
  tasks:
    hybrid_mask: true
    attention_mask_neg_value: -1.0e4
    weights:
      policy: 1.0
      fdm: 0.25
      idm: 0.25
      passive: 0.1
  action_model:
    action_model_type: DiT-B
    hidden_size: 1024
    action_dim: 7
    state_dim: 0
    action_horizon: 10
    add_pos_embed: true
    max_seq_len: 1024
    num_inference_timesteps: 6
    num_target_vision_tokens: 8
    repeated_diffusion_steps: 1
    noise_beta_alpha: 1.5
    noise_beta_beta: 1.0
    noise_s: 0.999
    num_timestep_buckets: 1000
    diffusion_model_cfg:
      cross_attention_dim: 896
      dropout: 0.1
      final_dropout: true
      interleave_self_attention: true
      norm_type: ada_norm
      num_layers: 24
      num_attention_heads: 12
      attention_head_dim: 64
      output_dim: 768
      positional_embeddings: null
  visual_model:
    d_dino: 384
    n_query: 196
    max_image_queries: 256
    hidden_size: 1024
    cross_attention_dim: 896
    num_attention_heads: 16
    attention_head_dim: 64
    num_layers: 12
    dropout: 0.1
    add_pos_embed: true
    max_seq_len: 1024
    num_inference_timesteps: 6

datasets:
  vla_data:
    dataset_py: jointflow
    data_root_dir: /horizon-bucket/robot_lab/users/sen.wang-labs/starVLA/DATA/LEBERO/libero
    data_mix: libero_all
    action_type: delta_qpos
    # 中文注释：LIBERO 的 lerobot `action` 本身就是 delta 控制量（OSC_POSE 增量），不能再用
    # action_mode=delta 二次差分。delta 模式会做 action[0]-state[0]（delta 减绝对 proprio，
    # roll 被搞成 ≈-π）并对后续步再差分，污染训练目标 → flow loss 仍低但 eval 全 0% SR。
    # 已是相对量时用 abs 透传，与 starvla_cotrain_libero / FastUMI(action_mode=abs) 一致。改此项需重训。
    action_mode: abs
    action_horizon: 10
    world_model:
      future_stride: 10
    sequential_step_sampling: false
    include_state: true
    dino_feature_dir: latents
    dino_feature_layout: lingbot_episode
    dino_episode_cache_size: 2
    CoT_prompt: "Your task is {instruction}. To identify the key objects for your task."
    per_device_batch_size: 4
    load_all_data_for_training: true
    video_backend: torchvision_av
    num_workers: 4
    prefetch_factor: 2
    pin_memory: true
    persistent_workers: true

trainer:
  max_train_steps: 200000
  num_warmup_steps: 1000
  save_interval: 5000
  eval_interval: 500
  learning_rate:
    base: 2.0e-04
    backbone: 2.0e-05
    dino_proj: 2.0e-04
    act_ctx: 2.0e-04
    state_enc: 2.0e-04
    action_queries: 2.0e-04
    future_dino_queries: 2.0e-04
    action_head: 2.0e-04
    visual_head: 2.0e-04
  lr_scheduler_type: constant_with_warmup
  scheduler_specific_kwargs: {}
  freeze_modules: ""
  loss_scale:
    vla: 1.0
  max_grad_norm: 1.0
  weight_decay: 0.0
  logging_frequency: 10
  task_loss_ema_beta: 0.98
  gradient_clipping: 1.0
  gradient_accumulation_steps: 8
  gradient_checkpointing: true
  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 0.0
