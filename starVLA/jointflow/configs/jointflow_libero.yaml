run_id: qwen_jointflow_libero
run_root_dir: playground/Debug_Checkpoints
seed: 42
wandb_entity: sanmumumu
wandb_project: starVLA_JointFlow
is_debug: false
version_id: "0.21"

framework:
  name: QwenJointFlow
  qwenvl:
    base_vlm: playground/Pretrained_models/Qwen2.5-0.5B
    attn_implementation: sdpa
    vl_hidden_dim: 896
    max_text_length: 256
  dino:
    name: dinov3_vits16
    hf_model_id: facebook/dinov3-vits16-pretrain-lvd1689m
    repo_or_dir: facebookresearch/dinov3
    weights: null
    loader: auto
    image_size: 224
    patch_size: 16
    embed_dim: 384
    future_view_keys: ["video.primary_image", "observation.images.image", "primary_image", "agentview"]
    stats_path: null
    load_live_backbone: false
    dino_pool: 1
  state:
    inject_mode: token
    n_state_tokens: 1
    state_dim: 8
  tasks:
    hybrid_mask: true
    weights:
      policy: 1.0
      fdm: 0.5
      idm: 0.5
      passive: 0.5
  action_model:
    action_model_type: DiT-B
    hidden_size: 1024
    action_dim: 7
    state_dim: 0
    action_horizon: 8
    num_inference_timesteps: 4
    num_target_vision_tokens: 8
    repeated_diffusion_steps: 1
    diffusion_model_cfg:
      cross_attention_dim: 896
      dropout: 0.1
      final_dropout: true
      interleave_self_attention: true
      norm_type: ada_norm
      num_layers: 8
      output_dim: 768
      positional_embeddings: null
  visual_model:
    d_dino: 384
    n_query: 196
    max_image_queries: 256
    hidden_size: 768
    cross_attention_dim: 896
    num_attention_heads: 12
    attention_head_dim: 64
    num_layers: 8
    dropout: 0.1
    add_pos_embed: true
    max_seq_len: 1024
    num_inference_timesteps: 4

datasets:
  vla_data:
    dataset_py: jointflow
    data_root_dir: /mnt/hwdata/wangsen/starVLA/DATA/LEBERO/libero
    data_mix: libero_object # libero_all
    action_type: delta_qpos
    action_mode: delta
    action_horizon: 8
    world_model:
      future_stride: 8
    sequential_step_sampling: false
    include_state: true
    dino_feature_dir: latents
    dino_feature_layout: lingbot_episode
    CoT_prompt: "Your task is {instruction}. To identify the key objects for your task."
    per_device_batch_size: 16
    load_all_data_for_training: true
    video_backend: torchvision_av
    num_workers: 16

trainer:
  max_train_steps: 100000
  num_warmup_steps: 5000
  save_interval: 5000
  eval_interval: 100
  learning_rate:
    base: 2.5e-05
    backbone: 1.0e-05
    dino_proj: 1.0e-04
    act_ctx: 1.0e-04
    state_enc: 1.0e-04
    queries: 1.0e-04
    action_head: 1.0e-04
    visual_head: 1.0e-04
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-06
  freeze_modules: ""
  loss_scale:
    vla: 1.0
  max_grad_norm: 1.0
  weight_decay: 0.0
  logging_frequency: 10
  task_loss_ema_beta: 0.98
  gradient_clipping: 1.0
  gradient_accumulation_steps: 4
  gradient_checkpointing: true
  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08
