run_id: qwen_jointflow_robotwin_aidi
run_root_dir: /horizon-bucket/robot_lab/users/sen.wang-labs/starVLA/outputs/starvla_jointflow
seed: 42
wandb_entity: sanmumumu
wandb_project: starVLA_JointFlow
is_debug: false
version_id: "0.21"

framework:
  name: QwenJointFlow
  qwenvl:
    base_vlm: playground/Pretrained_models/Qwen2.5-0.5B
    attn_implementation: eager
    torch_dtype: float32
    fp32_forward: true
    vl_hidden_dim: 896
    max_text_length: 256
  # 中文注释：RoboTwin 默认 DINO-L（vitl16，embed_dim=1024 由 resolve_dino_spec 自动同步到
  # visual_model.d_dino）。weights 本地留空走 torch.hub/HF 在线加载；集群离线场景用
  # _aidi 配置里的 HF snapshot 目录（dinov3-vitl16-pretrain-lvd1689m/）。
  dino:
    model_size: vitl16
    # 中文注释：集群离线环境用 bucket 上的 HF snapshot 目录（目录路径自动走 HF 模式）。
    weights: /horizon-bucket/robot_lab/users/sen.wang-labs/starVLA/CKPTS/dinov3-vitl16-pretrain-lvd1689m/
    loader: auto                  # auto | torchhub | hf
    repo_or_dir: facebookresearch/dinov3
    image_size: 224
    future_view_keys: ["video.cam_high", "cam_high"]
    stats_path: null
    load_live_backbone: true
    dino_pool: 1
  state:
    inject_mode: token
    n_state_tokens: 1
    state_dim: 14                 # aloha 双臂：左 6 关节+1 夹爪 + 右 6 关节+1 夹爪
  tasks:
    hybrid_mask: true
    attention_mask_neg_value: -1.0e4
    weights:
      policy: 1.0
      fdm: 0.5
      idm: 0.5
      passive: 0.5
  action_model:
    action_model_type: DiT-B
    hidden_size: 1024
    action_dim: 14
    state_dim: 0
    action_horizon: 16            # robotwin robot_type 默认 16 步 chunk
    add_pos_embed: true
    max_seq_len: 1024
    num_inference_timesteps: 10   # 中文注释：动作去噪 10 步（用户指定）
    num_target_vision_tokens: 8
    repeated_diffusion_steps: 1
    noise_beta_alpha: 1.5
    noise_beta_beta: 1.0
    noise_s: 0.999
    num_timestep_buckets: 1000
    diffusion_model_cfg:
      cross_attention_dim: 896
      dropout: 0.1
      final_dropout: true
      interleave_self_attention: true
      norm_type: ada_norm
      num_layers: 24
      num_attention_heads: 12
      attention_head_dim: 64
      output_dim: 768
      positional_embeddings: null
  visual_model:
    d_dino: 1024                  # 与 dino.model_size=vitl16 同步（framework 也会自动覆写）
    n_query: 196
    max_image_queries: 256
    hidden_size: 1024
    cross_attention_dim: 896
    num_attention_heads: 16
    attention_head_dim: 64
    num_layers: 12
    dropout: 0.1
    add_pos_embed: true
    max_seq_len: 1024
    num_inference_timesteps: 6

datasets:
  vla_data:
    dataset_py: jointflow
    data_root_dir: /horizon-bucket/robot_lab/users/sen.wang-labs/starVLA/DATA/RoboTwin
    # 中文注释：robotwin_all = 50 任务 × {Clean, Randomized} 共 100 个数据集
    # （examples/Robotwin/train_files/data_registry 注册，registry 自动发现）。
    # 也可用 robotwin（仅 50 任务，无前缀布局）/ robotwin_task1 等子集调试。
    data_mix: robotwin_all
    action_type: abs_qpos
    # 中文注释：RoboTwin 动作 = 绝对关节位置（abs_qpos），abs 透传，无差分问题。
    action_mode: abs
    action_horizon: 16
    # 中文注释："有 latent 就 latent，没有就在线"：auto = 混合内全部数据集存在
    # 维度匹配（1024）的离线 latents 才走离线，否则整体在线提特征。
    # 预计算 L-latents：python -m starVLA.jointflow.dino_precompute.dino_precompute --config_yaml 本文件
    online_dino: auto
    world_model:
      future_stride: 16           # 15fps ≈ 1.07s 后的未来帧，与 action chunk 对齐
    sequential_step_sampling: false
    include_state: true
    # 中文注释：eval server 端 state 归一化必须与训练一致——robotwin 训练侧
    # AgilexDataConfig.transform() 对 state 用 min_max（夹爪 binary）；这里显式声明，
    # 否则 jointflow_server_wrapper 的默认推断是 q99，train/eval 失配。
    state_norm_modes:
      state.left_joints: min_max
      state.right_joints: min_max
      state.left_gripper: binary
      state.right_gripper: binary
    dino_feature_dir: latents
    dino_feature_layout: lingbot_episode
    dino_episode_cache_size: 2
    CoT_prompt: "Your task is {instruction}. To identify the key objects for your task."
    per_device_batch_size: 2      # 在线 DINO-L：每样本最多 6 次 ViT-L 前向（3 视角×2 帧）
    load_all_data_for_training: true
    video_backend: torchvision_av # RoboTwin 视频为 av1 编码，需 PyAV(libdav1d) 支持
    num_workers: 8
    prefetch_factor: 2
    pin_memory: true
    persistent_workers: true

trainer:
  resume_from: null
  max_train_steps: 100000
  num_warmup_steps: 1000
  save_interval: 5000
  eval_interval: 500
  learning_rate:
    base: 2.0e-04
    backbone: 2.0e-05
    dino_proj: 2.0e-04
    act_ctx: 2.0e-04
    state_enc: 2.0e-04
    action_queries: 2.0e-04
    future_dino_queries: 2.0e-04
    action_head: 2.0e-04
    visual_head: 2.0e-04
  lr_scheduler_type: constant_with_warmup
  scheduler_specific_kwargs: {}
  freeze_modules: ""
  loss_scale:
    vla: 1.0
  max_grad_norm: 1.0
  weight_decay: 0.0
  logging_frequency: 10
  task_loss_ema_beta: 0.98
  gradient_clipping: 1.0
  gradient_accumulation_steps: 8
  gradient_checkpointing: true
  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 0.0
