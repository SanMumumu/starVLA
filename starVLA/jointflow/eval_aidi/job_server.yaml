REQUIRED:
  JOB_NAME: "starvla-jointflow-eval-server"
  JOB_PASSWD: "newk8s666"

  UPLOAD_DIR: "/home/users/sen02.wang-labs/aidi_jobs/starvla_dev"
  PROJECT_ID: "horizon-labs"

  # SERVER 节点：8 卡机起 8 个 policy server（GPU0-7），把 IP+端口发布到共享 bucket。
  WORKER_MIN_NUM: 1
  WORKER_MAX_NUM: 1
  GPU_PER_WORKER: 8

  # 集群路径：~/aidi_jobs/starvla_dev/starVLA/starVLA/jointflow/eval_aidi/run_server_aidi.sh
  # （${WORKING_PATH}=UPLOAD_DIR=~/aidi_jobs/starvla_dev；首个 starVLA=仓库目录，次个=包目录）
  RUN_SCRIPTS: "${WORKING_PATH}/starVLA/starVLA/jointflow/eval_aidi/run_server_aidi.sh"

OPTIONAL:
  FRAMEWORK: "pytorch"
  TASK_LABEL: "DEV"
  PRIORITY: 5
  # server 用 starVLA 训练镜像（含 torch / transformers）。
  DOCKER_IMAGE: "docker.hobot.cc/imagesys/starvla:v1.0"
  WALL_TIME: 20000
  JOB_TYPE: "train"
  REMARK: "jointflow libero eval - SERVER node (8 policy servers)"
  DATA_SPACE:
    DATA_TYPE: "dmp"
    INPUT: "robot_lab"
    OUTPUT: "robot_lab"
