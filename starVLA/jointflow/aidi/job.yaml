######### // code // ##########
# 中文注释：JointFlow AIDI 训练任务模板（实验管理范式同 starVLA/triflow/aidi/）。
# 提交一个新实验只改两处：
#   1) JOB_NAME      → jointflow-<实验名>（与 experiments/ 文件名对应，便于面板检索）
#   2) RUN_SCRIPTS   → 末尾的实验名参数（experiments/<实验名>.sh，不带 .sh）
# 若平台不支持 RUN_SCRIPTS 携带参数，则改 run_aidi.sh 顶部的 EXP 默认值。
# 评测任务模板见 aidi/eval/job_server.yaml + job_client.yaml（LIBERO 双任务对）。
######### // code // ##########
REQUIRED:
  JOB_NAME: "jointflow-e201-robotwin-task1-8gpu"
  JOB_PASSWD: "newk8s666"

  UPLOAD_DIR: "/home/users/sen02.wang-labs/aidi_jobs/starvla_dev"
  PROJECT_ID: "horizon-labs"

  WORKER_MIN_NUM: 1
  WORKER_MAX_NUM: 1
  GPU_PER_WORKER: 8

  # UPLOAD_DIR 是 starvla_dev，代码仓在 starvla_dev/starVLA；
  # 入口固定为 starVLA/jointflow/aidi/run_aidi.sh，最后一个参数 = 实验名。
  RUN_SCRIPTS: "${WORKING_PATH}/starVLA/starVLA/jointflow/aidi/run_aidi.sh e201_robotwin_task1_sanity"

OPTIONAL:
  FRAMEWORK: "pytorch"
  TASK_LABEL: "DEV"
  PRIORITY: 5
  DOCKER_IMAGE: "docker.hobot.cc/imagesys/starvla:v1.0"
  WALL_TIME: 20000
  JOB_TYPE: "train"
  REMARK: "jointflow single-node 8gpu (Qwen + online DINO + dual flow heads)"
  DATA_SPACE:
    DATA_TYPE: "dmp"
    INPUT: "robot_lab"
    OUTPUT: "robot_lab"
