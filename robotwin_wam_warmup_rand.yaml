#######
# RoboTwin WAM M5 oracle warmup —— RAND 设定 (chunk=16), AIDI job.
# rand 设定：每个任务 50 干净 + 500 随机数据（data_mix=robotwin_all_16）。
# Submit:
#   aidi-inf-cli job submit -f robotwin_wam_warmup_rand.yaml -q project-h20-horizon-labs-acloud
# Default scale: 4 workers x 8 GPUs = 32 GPUs (per_device 4 -> global batch 128).
#######
REQUIRED:
  JOB_NAME: "starvla-wam-robotwin-warmup-rand-h16-4x8"
  JOB_PASSWD: "newk8s666"

  UPLOAD_DIR: "/home/users/sen02.wang/workspace/starvla_dev"
  PROJECT_ID: "horizon-labs"

  WORKER_MIN_NUM: 4
  WORKER_MAX_NUM: 4
  GPU_PER_WORKER: 8

  RUN_SCRIPTS: "${WORKING_PATH}/run_aidi_rbtw.sh examples/Robotwin/train_files/robotwin_wam_warmup_rand.yaml"

OPTIONAL:
  FRAMEWORK: "pytorch"
  TASK_LABEL: "DEV"
  PRIORITY: 5
  DOCKER_IMAGE: "docker.hobot.cc/imagesys/starvla:v2.1"
  WALL_TIME: 20000
  JOB_TYPE: "train"
  REMARK: "RoboTwin WAM M5 oracle warmup RAND; Qwen3-VL-2B; chunk=16; robotwin_all_16; 4x8 H20"
  DATA_SPACE:
    DATA_TYPE: "dmp"
    INPUT: "robot_lab"
    OUTPUT: "robot_lab"
