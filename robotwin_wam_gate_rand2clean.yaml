#######
# RoboTwin WAM M5 predicted-gate —— RAND 流程 (chunk=16), AIDI job.
# 先跑 robotwin_wam_warmup_rand.yaml，等它出 ckpt 后把
# examples/Robotwin/train_files/robotwin_wam_gate_rand2clean.yaml 的 trainer.pretrained_checkpoint 确认好，再提交本 job。
# Submit:
#   aidi-inf-cli job submit -f robotwin_wam_gate_rand2clean.yaml -q project-h20-horizon-labs-acloud
# Default scale: 4 workers x 8 GPUs = 32 GPUs.
#######
REQUIRED:
  JOB_NAME: "starvla-wam-robotwin-gate-rand2clean-h16-4x8"
  JOB_PASSWD: "newk8s666"

  UPLOAD_DIR: "/home/users/sen02.wang/workspace/starvla_dev"
  PROJECT_ID: "horizon-labs"

  WORKER_MIN_NUM: 4
  WORKER_MAX_NUM: 4
  GPU_PER_WORKER: 8

  RUN_SCRIPTS: "${WORKING_PATH}/run_aidi_rbtw.sh examples/Robotwin/train_files/robotwin_wam_gate_rand2clean.yaml"

OPTIONAL:
  FRAMEWORK: "pytorch"
  TASK_LABEL: "DEV"
  PRIORITY: 5
  DOCKER_IMAGE: "docker.hobot.cc/imagesys/starvla:v2.1"
  WALL_TIME: 20000
  JOB_TYPE: "train"
  REMARK: "RoboTwin WAM M5 gate predicted RAND(rand2clean); Qwen3-VL-2B; chunk=16; robotwin_all_16; 4x8 H20"
  DATA_SPACE:
