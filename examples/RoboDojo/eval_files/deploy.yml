policy_name: starVLA
protocol: ws
bench_name: null
task_name: null
env_cfg_type: null
action_type: joint
gpu_id: null
seed: null
eval_batch: false

# Repository-owned StarVLA server reached by the lightweight XPolicy adapter.
host: localhost
port: 6000
starvla_server_host: 127.0.0.1
starvla_server_port: 5694
# eval_robodojo.sh fills this with STARVLA_CKPT_PATH and the adapter verifies
# that the remote server loaded the exact same checkpoint.
expected_checkpoint_path: null
unnorm_key: new_embodiment
use_ddim: true
num_ddim_steps: 10
# Execute this many actions from each H16 chunk before querying again.
replan_interval: 12
# Inference-time Real-Time Chunking (RTC). With H16/replan12 the previous
# chunk has exactly four unexecuted actions, so four is the largest meaningful
# consistency horizon. For this short H4 overlap, delay=1 deliberately makes
# the first transition action a hard anchor before the remaining linear fade;
# it does not claim that the synchronous simulator has one step of latency.
rtc_enabled: false
rtc_execution_horizon: 4
rtc_inference_delay: 1
rtc_max_guidance_weight: 20.0
rtc_prefix_attention_schedule: linear
# Print normalized switch/prefix errors for the first N replans in each env.
# Set to zero after the RTC setting has been validated.
rtc_debug_max_replans: 8
# For text-supervised checkpoints, refresh AR planner text once every N action
# replans. Intermediate action replans reuse the text with the latest image.
text_replan_chunks: 4
# Planner text can be useful for debugging but is too noisy for a 2100-episode
# official run. ROBODOJO_LOG_PLANNER_TEXT can override this per invocation.
log_planner_text: false

# Optional simulator-rollout event-memory figures. eval_robodojo.sh enables
# this only for ROBODOJO_SAVE_MODE=images and supplies the concrete output.
eventmem_capture: false
eventmem_output_dir: null
eventmem_max_frames: 9
eventmem_num_envs: 1

# These are hard ABI checks, not image-processing suggestions.
image_size: [320, 384]
expected_image_layout: fastwam_composite
expected_composite_view_key: video.fastwam_composite
expected_action_chunk_size: 16
expected_action_dim: 14
