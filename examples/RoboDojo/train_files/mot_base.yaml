# Qwen3-VL planner with a causal current/future-DINO and action physical flow.
#
# Physical token order:
#   [z0 (clean current DINO), zf(t) (noisy future DINO), af(t) (noisy action)]
#
# Mask:
#   z0 -> z0
#   zf -> [z0, zf]
#   af -> [z0, af]
#
# z0 uses flow timestep zero and is clamped during every sampling step.
# World uses 2D spatial RoPE plus current/future frame-type embeddings; action
# uses 1D horizon RoPE. Experts have independent Q/K/V, FFN and output heads.
# Every layer mixes their self-attention Q/K/V once; world never reads action.
# Cross-attention KV is [WORLD_PLAN, state] for world and
# [ACTION_PLAN, state] for action; neither condition enters the physical stream.

run_id: starvla_qwen3_robodojo_dino_mot_base_50k
run_root_dir: /horizon-bucket/robot_lab/users/sen.wang-labs/starVLA/outputs/starvla_robodojo
seed: 42
wandb_entity: axi-the-cat
wandb_project: starVLA_RoboDojo
is_debug: false
version_id: "0.21"

framework:
  name: QwenWorldActionMoT
  enable_world_action_mot: true

  qwenvl:
    base_vlm: /horizon-bucket/robot_lab/users/sen.wang-labs/starVLA/CKPTS/Qwen3-VL-2B-Instruct/
    attn_implementation: flash_attention_2
    require_attn_implementation: true
    enable_gradient_checkpointing: true
    vl_hidden_dim: 2048

  planner:
    num_world_queries: 16
    num_action_queries: 16
    world_placeholder_token: "<WORLD_PLAN>"
    action_placeholder_token: "<ACTION_PLAN>"
    text_supervision:
      enabled: false
      allow_missing_annotations: true

  world_action_mot:
    architecture: causal_dino_mot
    interaction_mode: base
    world_attention_mask_mode: first_frame_causal

    # Dual-expert architecture.
    world_hidden_size: 512
    action_hidden_size: 1024
    world_ffn_dim: 2048
    action_ffn_dim: 4096
    num_layers: 30
    num_attention_heads: 24
    attention_head_dim: 128
    norm_eps: 1.0e-06
    time_frequency_dim: 256
    world_grid_height: 12
    world_grid_width: 10
    max_world_tokens: 120
    enable_gradient_checkpointing: true

    # Independent continuous-flow schedulers.
    world_train_shift: 5.0
    world_infer_shift: 5.0
    world_num_train_timesteps: 1000
    action_train_shift: 5.0
    action_infer_shift: 5.0
    action_num_train_timesteps: 1000
    num_inference_timesteps: 20

    action_loss_weight: 1.0
    world_loss_weight: 1.0
    text_loss_weight: 0.0

  dino:
    name: dinov3_vitb16
    model_size: base
    hf_model_id: /horizon-bucket/robot_lab/users/sen.wang-labs/starVLA/CKPTS/DINO-B/
    weights: /horizon-bucket/robot_lab/users/sen.wang-labs/starVLA/CKPTS/DINO-B/
    loader: hf
    image_size: [384, 320]
    patch_size: 16
    embed_dim: 768
    stats_path: null
    load_live_backbone: true
    force_online: true
    dino_pool: 2

  action_model:
    action_dim: 14
    state_dim: 14
    action_horizon: 16

datasets:
  vla_data:
    dataset_py: jointflow
    data_root_dir: /horizon-bucket/robot_lab/users/sen.wang-labs/RoboDojo
    data_mix: robodojo_v21_language_optional
    lerobot_version: v2.1
    image_layout: tri_view_composite
    composite_source_view_keys: ["video.cam_high", "video.cam_left_wrist", "video.cam_right_wrist"]
    composite_view_key: "video.tri_view_composite"
    include_state: true
    action_type: abs_qpos
    action_mode: abs
    action_horizon: 16
    world_model:
      future_stride: 16
    future_valid_requires_full_stride: true
    decode_future_video: true
    online_dino: true
    dino_target_latents: false
    optional_text_annotations:
      enabled: false
      require_columns: false
    sequential_step_sampling: false
    balance_dataset_weights: false
    balance_trajectory_weights: false
    per_device_batch_size: 12
    load_all_data_for_training: true
    obs_image_size: [320, 384]
    video_backend: pyav
    num_workers: 8
    prefetch_factor: 2
    pin_memory: true
    persistent_workers: false

trainer:
  seed_before_model_init: true
  expected_global_batch_size: 768
  max_train_steps: 50000
  num_warmup_steps: 2000
  save_interval: 10000
  eval_interval: 1000
  world_validation:
    enabled: false
  pretrained_checkpoint: null
  is_resume: false
  save_full_training_state: true
  learning_rate:
    base: 1.0e-05
    qwen_vl_interface: 1.0e-05
    action_plan_queries: 1.0e-04
    world_plan_queries: 1.0e-04
    action_model: 1.0e-04
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 5.0e-07
  freeze_modules: ""
  loss_scale:
    vla: 1.0
  max_grad_norm: 1.0
  weight_decay: 0.0
  logging_frequency: 200
  log_grad_norms: false
  log_global_grad_norm: true
  deepspeed_skip_unused_param_anchors: true
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1
  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08
