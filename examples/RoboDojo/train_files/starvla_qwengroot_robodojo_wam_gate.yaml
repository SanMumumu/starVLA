#######
# RoboDojo WAM stage 2: predicted future-state gated post-training.
# This stage must load the completed oracle-warmup checkpoint; the current and
# future inputs remain the same single 320x384 FastWAM composites, and every
# state, action, DINO, and policy setting otherwise remains identical.
#######

run_id: starvla_qwengroot_robodojo_wam_gate_h16_jitx_corrnoise_zscore
run_root_dir: /horizon-bucket/robot_lab/users/sen.wang-labs/starVLA/outputs/starvla_robodojo
seed: 42
wandb_entity: axi-the-cat
wandb_project: starVLA_RoboDojo
is_debug: false
version_id: "0.21"

framework:
  name: QwenGR00T

  qwenvl:
    base_vlm: /horizon-bucket/robot_lab/users/sen.wang-labs/starVLA/CKPTS/Qwen3-VL-2B-Instruct/
    attn_implementation: flash_attention_2
    enable_gradient_checkpointing: true
    vl_hidden_dim: 2048

  wam:
    enabled: true
    action_gradient_checkpointing: true
    placeholder_token: "<ACT_PH>"
    dino_loss_weight: 0.1
    world_target: absolute
    guidance:
      enabled: true
      mode: dual_xattn
      signal: z_pred
      prompt_mode: dual_query
      bridge_source: predicted
      detach_world: true
      # Predicted-only stage. This is ignored for bridge_source=predicted, but
      # keep it at zero so a future switch to scheduled cannot restore oracle.
      oracle_ratio: 0.0
      n_world_tokens: 64
      qformer_layers: 2
      fusion_layers: 2
      gate_init: 0.0
      # W&B: effective tanh(gate) mean-abs/signed-mean/max on both policy and
      # passive log steps. This is detached monitoring only.
      log_gate_openness: true
      world_dropout: 0.0
      include_context_in_world_memory: true
      world_eval_mode: correct

  tasks:
    weights:
      policy: 1.0
      passive: 1.0

  dino:
    name: dinov3_vitl16
    model_size: large
    hf_model_id: /horizon-bucket/robot_lab/users/sen.wang-labs/starVLA/CKPTS/DINO/
    weights: /horizon-bucket/robot_lab/users/sen.wang-labs/starVLA/CKPTS/DINO/
    loader: hf
    # DINO tensor order is [height, width]: one 24x20=480-token composite grid.
    image_size: [384, 320]
    patch_size: 16
    embed_dim: 1024
    future_view_keys: ["video.fastwam_composite"]
    stats_path: null
    load_live_backbone: false
    dino_pool: 1

  action_model:
    action_model_type: DiT-LAWAM
    action_hidden_dim: 1024
    hidden_size: 1024
    add_pos_embed: true
    max_seq_len: 1024

    action_dim: 14
    state_dim: 14
    action_horizon: 16

    repeated_diffusion_steps: 2
    noise_beta_alpha: 1.5
    noise_beta_beta: 1.0
    noise_s: 0.999
    num_timestep_buckets: 1000
    num_inference_timesteps: 10
    prediction_type: jit_x
    jit_t_eps: 0.05
    flow_time_sampling: gr00t

    use_correlated_noise: true
    correlation_beta: 0.5
    correlation_num_samples: 4096
    correlation_matrix_type: correlation
    # The warmup copy is the RoboDojo-only matrix originally estimated by the
    # RoboDojo baseline; never reuse a RobotWin rand/clean matrix here.
    correlation_cholesky_path: /horizon-bucket/robot_lab/users/sen.wang-labs/starVLA/outputs/starvla_robodojo/starvla_qwengroot_robodojo_wam_warmup_h16_jitx_corrnoise_zscore/action_correlation_cholesky.npy
    num_target_vision_tokens: 32

    diffusion_model_cfg:
      cross_attention_dim: 2048
      dropout: 0.2
      final_dropout: true
      interleave_self_attention: true
      norm_type: ada_norm
      num_layers: 16
      output_dim: 1024
      positional_embeddings: null

  visual_model:
    d_dino: 1024
    n_flow_query: 64
    max_target_tokens: 480
    hidden_size: 1024
    cross_attention_dim: 2048
    num_attention_heads: 16
    attention_head_dim: 64
    num_layers: 12
    dropout: 0.1
    add_pos_embed: true
    max_seq_len: 480
    num_inference_timesteps: 6
    patch_weighting: change

datasets:
  vla_data:
    dataset_py: jointflow
    data_root_dir: /horizon-bucket/robot_lab/users/sen.wang-labs/RoboDojo
    data_mix: robodojo_v21
    lerobot_version: v2.1

    image_layout: fastwam_composite
    composite_source_view_keys: ["video.cam_high", "video.cam_left_wrist", "video.cam_right_wrist"]
    composite_view_key: "video.fastwam_composite"

    include_state: true
    # RoboDojoArxX5DataConfig applies FastWAM's clipped z-score to every
    # continuous state/action component (including both grippers).
    action_type: abs_qpos
    action_mode: abs
    # JointFlow reads its action sampling horizon from the dataset section.
    # Keep it explicit and equal to framework.action_model.action_horizon.
    action_horizon: 16
    sequential_step_sampling: false
    balance_dataset_weights: false
    balance_trajectory_weights: false
    per_device_batch_size: 16

    load_all_data_for_training: true
    # PIL/config order is [width, height].
    obs_image_size: [320, 384]
    video_backend: pyav
    num_workers: 8
    prefetch_factor: 2
    pin_memory: true
    persistent_workers: false

    online_dino: true
    dino_target_latents: false
    decode_future_video: true
    # Tail frames without a complete t+16 target are excluded from world loss.
    future_valid_requires_full_stride: true
    action_pack_dtype: float16
    world_model:
      future_stride: 16

trainer:
  max_train_steps: 80000
  num_warmup_steps: 2000
  save_interval: 10000
  eval_interval: 1000
  pretrained_checkpoint: /horizon-bucket/robot_lab/users/sen.wang-labs/starVLA/outputs/starvla_robodojo/starvla_qwengroot_robodojo_wam_warmup_h16_jitx_corrnoise_zscore/final_model/pytorch_model.pt
  is_resume: false

  learning_rate:
    base: 1.0e-05
    qwen_vl_interface: 1.0e-05
    action_model: 1.0e-04

  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 5.0e-07

  freeze_modules: ''

  loss_scale:
    vla: 1.0

  max_grad_norm: 1.0
  weight_decay: 0.0
  logging_frequency: 200
  log_grad_norms: false
  deepspeed_skip_unused_param_anchors: true
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1

  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08
