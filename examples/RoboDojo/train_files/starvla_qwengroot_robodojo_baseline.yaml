#######
# RoboDojo baseline: native QwenGR00T plus the full RobotWin FastWAM-baseline
# optimization recipe (jit_x, repeated FM objective, correlated noise).
# RoboDojo is 25 Hz, so H=16 covers the same 0.64 s physical horizon as H=32
# on the 50 Hz RobotWin release. The three released views are packed into the
# exact single 320x384 FastWAM composite and paired with the current 14-D state.
#######

run_id: starvla_qwengroot_robodojo_baseline_h16_jitx_corrnoise_zscore
run_root_dir: /horizon-bucket/robot_lab/users/sen.wang-labs/starVLA/outputs/starvla_robodojo
seed: 42
wandb_entity: axi-the-cat
wandb_project: starVLA_RoboDojo
is_debug: false
version_id: "0.21"

framework:
  name: QwenGR00T

  qwenvl:
    base_vlm: /horizon-bucket/robot_lab/users/sen.wang-labs/starVLA/CKPTS/Qwen3-VL-2B-Instruct/
    attn_implementation: flash_attention_2
    enable_gradient_checkpointing: true
    vl_hidden_dim: 2048

  action_model:
    action_model_type: DiT-M
    action_hidden_dim: 1024
    hidden_size: 1024
    add_pos_embed: true
    max_seq_len: 1024

    action_dim: 14
    state_dim: 14
    action_horizon: 16

    repeated_diffusion_steps: 2
    noise_beta_alpha: 1.5
    noise_beta_beta: 1.0
    noise_s: 0.999
    num_timestep_buckets: 1000
    num_inference_timesteps: 10
    prediction_type: jit_x
    jit_t_eps: 0.05
    flow_time_sampling: gr00t

    use_correlated_noise: true
    correlation_beta: 0.5
    correlation_num_samples: 4096
    correlation_matrix_type: correlation
    num_target_vision_tokens: 32

    diffusion_model_cfg:
      cross_attention_dim: 2048
      dropout: 0.2
      final_dropout: true
      interleave_self_attention: true
      norm_type: ada_norm
      num_layers: 16
      output_dim: 1024
      positional_embeddings: null

datasets:
  vla_data:
    dataset_py: lerobot_datasets
    data_root_dir: /horizon-bucket/robot_lab/users/sen.wang-labs/RoboDojo
    data_mix: robodojo_v21
    lerobot_version: v2.1

    # Exact FastWAM layout: head 320x256 on top; 160x128 left/right wrists
    # side-by-side below, producing one 320x384 RGB policy image.
    image_layout: fastwam_composite
    composite_source_view_keys: ["video.cam_high", "video.cam_left_wrist", "video.cam_right_wrist"]
    composite_view_key: "video.fastwam_composite"

    include_state: true
    # RoboDojoArxX5DataConfig applies FastWAM's clipped z-score to every
    # continuous state/action component (including both grippers).
    action_type: abs_qpos
    action_mode: abs
    sequential_step_sampling: false
    balance_dataset_weights: false
    balance_trajectory_weights: false
    per_device_batch_size: 16

    load_all_data_for_training: true
    # PIL/config order is [width, height].
    obs_image_size: [320, 384]
    video_backend: pyav
    num_workers: 8
    prefetch_factor: 2
    pin_memory: true
    persistent_workers: false

trainer:
  max_train_steps: 80000
  num_warmup_steps: 2000
  save_interval: 10000
  eval_interval: 1000

  learning_rate:
    base: 1.0e-05
    qwen_vl_interface: 1.0e-05
    action_model: 1.0e-04

  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 5.0e-07

  freeze_modules: ''

  loss_scale:
    vla: 1.0

  max_grad_norm: 1.0
  weight_decay: 0.0
  logging_frequency: 200
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1

  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08
