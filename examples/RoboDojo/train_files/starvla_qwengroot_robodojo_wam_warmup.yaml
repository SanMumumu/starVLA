#######
# RoboDojo WAM predictor warmup (Stage 1/2).
# H=16 at 25 Hz; online DINO-B targets use the FastWAM composite view.
# The native policy context is preserved while world->action modules remain
# closed, frozen, and bypassed for the full 80k warmup.
#######

run_id: starvla_qwengroot_robodojo_wam_text_warmup_h16_dinob_online_iid_80k
run_root_dir: /horizon-bucket/robot_lab/users/sen.wang-labs/starVLA/outputs/starvla_robodojo
seed: 42
wandb_entity: axi-the-cat
wandb_project: starVLA_RoboDojo
is_debug: false
version_id: "0.21"

framework:
  name: QwenGR00T
  qwenvl:
    base_vlm: /horizon-bucket/robot_lab/users/sen.wang-labs/starVLA/CKPTS/Qwen3-VL-2B-Instruct/
    attn_implementation: flash_attention_2
    enable_gradient_checkpointing: true
    vl_hidden_dim: 2048

  wam:
    enabled: true
    action_gradient_checkpointing: true
    visual_gradient_checkpointing: true
    placeholder_token: "<ACT_PH>"
    dino_loss_weight: 0.1
    world_target: absolute
    text_supervision:
      enabled: true
      allow_missing_annotations: true
      subtask_field: subtask_text
      completed_subtask_field: completed_subtask_text
      prompt_template: "{instruction}\nReport the current subtask and the completed subtask."
      response_template: "Current subtask: {subtask_text}\nCompleted subtask: {completed_subtask_text}"
    guidance:
      enabled: true
      mode: dual_xattn
      signal: z_pred
      prompt_mode: dual_query
      exclude_post_query_context: true
      action_world_bypass: true
      world_to_action_enabled: true
      freeze_world_to_action_in_warmup: true
      bridge_source: predicted
      detach_world: true
      detached_prediction_eval_mode: true
      detach_action_backbone: false
      detach_world_backbone: true
      baseline_action_context: true
      pretraining_aligned_queries: false
      future_query_through_qwen: false
      world_condition_on_state: true
      include_context_in_action_memory: true
      include_context_in_world_memory: true
      concat_current_dino: false
      gate_init: 0.0
      world_dropout: 0.0
      log_gate_openness: true
      oracle_ratio: 0.0
      world_eval_mode: correct

  tasks:
    weights:
      policy: 0.0
      passive: 0.0
      joint_detached: 1.0
    # Every batch trains action + world; annotated rows additionally train
    # assistant-only text tokens. Empty annotation rows remain valid samples.
    loss_weights:
      action: 1.0
      world: 0.1
      text: 0.005

  dino:
    name: dinov3_vitb16
    model_size: base
    hf_model_id: /horizon-bucket/robot_lab/users/sen.wang-labs/starVLA/CKPTS/DINO-B/
    weights: /horizon-bucket/robot_lab/users/sen.wang-labs/starVLA/CKPTS/DINO-B/
    loader: hf
    image_size: [384, 320]
    patch_size: 16
    embed_dim: 768
    future_view_keys: ["video.fastwam_composite"]
    stats_path: null
    load_live_backbone: true
    force_online: true
    dino_pool: 1

  action_model:
    action_model_type: DiT-M
    action_hidden_dim: 1024
    hidden_size: 1024
    add_pos_embed: true
    max_seq_len: 1024
    action_dim: 14
    state_dim: 14
    action_horizon: 16
    repeated_diffusion_steps: 2
    noise_beta_alpha: 1.5
    noise_beta_beta: 1.0
    noise_s: 0.999
    num_timestep_buckets: 1000
    num_inference_timesteps: 10
    prediction_type: jit_x
    jit_t_eps: 0.05
    flow_time_sampling: gr00t
    use_correlated_noise: false
    num_target_vision_tokens: 32
    diffusion_model_cfg:
      cross_attention_dim: 2048
      dropout: 0.2
      final_dropout: true
      interleave_self_attention: true
      norm_type: ada_norm
      num_layers: 16
      output_dim: 1024
      positional_embeddings: null

  visual_model:
    d_dino: 768
    n_flow_query: 64
    max_image_queries: 64
    max_target_tokens: 480
    hidden_size: 1024
    cross_attention_dim: 2048
    num_attention_heads: 16
    attention_head_dim: 64
    num_layers: 12
    dropout: 0.1
    add_pos_embed: true
    max_seq_len: 480
    noise_beta_alpha: 1.5
    noise_beta_beta: 1.0
    noise_s: 0.999
    num_timestep_buckets: 1000
    num_inference_timesteps: 10
    prediction_type: jit_x
    jit_t_eps: 0.05
    flow_time_sampling: gr00t
    clean_target_loss_weight: 1.0
    cosine_loss_weight: 0.1

datasets:
  vla_data:
    dataset_py: jointflow
    data_root_dir: /horizon-bucket/robot_lab/users/sen.wang-labs/RoboDojo
    data_mix: robodojo_v21_language_optional
    lerobot_version: v2.1
    image_layout: fastwam_composite
    composite_source_view_keys: ["video.cam_high", "video.cam_left_wrist", "video.cam_right_wrist"]
    composite_view_key: "video.fastwam_composite"
    include_state: true
    action_type: abs_qpos
    action_mode: abs
    action_horizon: 16
    world_model:
      future_stride: 16
    future_valid_requires_full_stride: true
    online_dino: true
    dino_target_latents: false
    optional_text_annotations:
      enabled: true
      require_columns: true
      fields:
        subtask_text: subtask_text
        completed_subtask_text: complete_text
      missing_values: [""]
    sequential_step_sampling: false
    balance_dataset_weights: false
    balance_trajectory_weights: false
    per_device_batch_size: 16
    load_all_data_for_training: true
    obs_image_size: [320, 384]
    video_backend: pyav
    num_workers: 8
    prefetch_factor: 2
    pin_memory: true
    persistent_workers: false

trainer:
  wam_two_stage_phase: predictor_warmup
  wam_two_stage_recipe: baseline_preserving_v3
  expected_global_batch_size: 1024
  max_train_steps: 80000
  num_warmup_steps: 2000
  save_interval: 10000
  eval_interval: 1000
  world_validation:
    enabled: true
    interval: 5000
    task: joint_detached
    per_device_batch_size: 1
    num_workers: 2
    num_batches: 4
    num_samples: 1
    num_inference_timesteps: 10
    seed: 2027
  pretrained_checkpoint: null
  is_resume: false
  save_full_training_state: true
  learning_rate:
    base: 1.0e-05
    qwen_vl_interface: 1.0e-05
    action_model: 1.0e-04
    wam_visual_head: 1.0e-04
    wam_state_ctx: 1.0e-04
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 5.0e-07
  freeze_modules: 'wam_act_ctx'
  loss_scale:
    vla: 1.0
  max_grad_norm: 1.0
  weight_decay: 0.0
  logging_frequency: 200
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1
  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08
