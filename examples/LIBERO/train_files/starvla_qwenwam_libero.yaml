#######
# 中文注释：QwenWAM 训练配置——qwenvl-gr00t 原生视觉 policy + DINO 只做监督头（参考 LaWAM）。
# framework.wam.enabled=true 接管：Qwen3-VL-2B 原生视觉 + act 占位 query→action head（policy），
# flow 占位 query→预测未来 DINO（监督，仅训练）。DINO 不进 policy、推理不碰。与 jointflow(DINO当视觉)互斥。
# 与 starvla_cotrain_libero.yaml 对齐；仅 WAM 专属/必需处加注释，和源一致的字段不注释。
#######
run_id: starvla_qwenwam
run_root_dir: /horizon-bucket/robot_lab/users/sen.wang-labs/starVLA/outputs/starvla_qwenwam
seed: 42
wandb_entity: your_wandb_entity
wandb_project: starvla_qwenwam
is_debug: false
version_id: "0.21"

framework:
  name: QwenGR00T
  qwenvl:
    base_vlm: /horizon-bucket/robot_lab/users/sen.wang-labs/starVLA/CKPTS/Qwen3-VL-2B-Instruct/
    attn_implementation: sdpa
    enable_gradient_checkpointing: true
    vl_hidden_dim: 2048
    max_text_length: 256
  #######
  # 中文注释：WAM 总开关 + 占位 token + DINO 监督权重。
  wam:
    enabled: true
    placeholder_token: "<ACT_PH>"
    dino_loss_weight: 1.0
  #######
  #######
  # 中文注释：四种建模范式（创新点1）的采样权重——trainer 每步广播采一个 task：
  #   policy(图→动作) / passive(图→未来DINO) / fdm(图+动作→未来DINO) / idm(图+未来图→动作)。
  # 两组 query 依托不同范式：act-query 服务 policy/idm，flow-query 服务 passive/fdm。实验可 override 这里。
  tasks:
    weights:
      policy: 1.0
      passive: 0.5
      fdm: 0.5
      idm: 0.5
  #######
  #######
  # 中文注释：DINO 仅作监督头的预测 target（未来帧 DINO），policy/推理不用；stats_path=null（target 自洽即可）。
  dino:
    name: dinov3_vits16
    hf_model_id: facebook/dinov3-vits16-pretrain-lvd1689m
    repo_or_dir: /horizon-bucket/robot_lab/users/sen.wang-labs/starVLA/CKPTS/dinov3_repo
    weights: /horizon-bucket/robot_lab/users/sen.wang-labs/starVLA/CKPTS/dinov3-vits16-pretrain-lvd1689m/
    loader: auto
    image_size: 224
    patch_size: 16
    embed_dim: 384
    future_view_keys: ["video.primary_image", "observation.images.image", "primary_image", "agentview"]
    stats_path: null
    load_live_backbone: false
    dino_pool: 1
  #######
  action_model:
    action_model_type: DiT-B
    action_dim: 7
    state_dim: 7
    action_horizon: 8
    n_action_query: 32        # 中文注释：act 占位 query 数（policy 条件 token 数，与 chunk 解耦）；动作虽 8×7，但留足条件容量
    add_pos_embed: true
    max_seq_len: 1024
    num_inference_timesteps: 10
    num_timestep_buckets: 1000
    noise_beta_alpha: 1.5
    noise_beta_beta: 1.0
    noise_s: 0.999
    repeated_diffusion_steps: 1
    diffusion_model_cfg:
      cross_attention_dim: 2048
      dropout: 0.1
      final_dropout: true
      interleave_self_attention: true
      norm_type: ada_norm
      num_layers: 24
      num_attention_heads: 12
      attention_head_dim: 64
      output_dim: 768
      positional_embeddings: null
  #######
  # 中文注释：visual_model = DINO 监督头（flow 占位 query→预测未来 DINO 特征）。n_flow_query=flow 占位 token 数。
  visual_model:
    d_dino: 384
    n_query: 196
    n_flow_query: 64          # 中文注释：flow 占位 query 数（DINO 世界模型条件容量）；DINO field 196×384 很大，给更多条件 token
    max_image_queries: 256
    hidden_size: 1024
    cross_attention_dim: 2048
    num_attention_heads: 16
    attention_head_dim: 64
    num_layers: 12
    dropout: 0.1
    add_pos_embed: true
    max_seq_len: 1024
    num_inference_timesteps: 6
    patch_weighting: change
  #######

datasets:
  vla_data:
    dataset_py: jointflow
    data_root_dir: /horizon-bucket/robot_lab/users/sen.wang-labs/starVLA/DATA/LEBERO/libero
    data_mix: libero_all
    action_type: delta_qpos
    sequential_step_sampling: false
    include_state: false
    CoT_prompt: "Your task is {instruction}. To identify the key objects for your task. Locate their bounding boxes in [x1,y1,x2,y2] format."
    per_device_batch_size: 8
    load_all_data_for_training: true
    video_backend: torchvision_av
    #######
    # 中文注释：WAM 必需：online_dino=true 强制数据集产出 raw image_0(当前 main+wrist)+image_1(未来帧)——
    # policy 用 image_0 走 Qwen 原生视觉，监督 target=DINO(image_1)。future_stride=未来帧步长。
    online_dino: true
    world_model:
      future_stride: 8
    #######

trainer:
  max_train_steps: 100000
  num_warmup_steps: 5000
  save_interval: 5000
  #######
  # 中文注释：WAM 走独立 LIBERO server 评测（server 无需 --dino_stats_path，policy 不用 DINO），关 in-loop eval。
  eval_interval: 1000000
  #######
  learning_rate:
    base: 2.5e-05
    qwen_vl_interface: 1.0e-05
    action_model: 1.0e-04
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-06
  #######
  # 中文注释：backbone 不冻结，全量训；VLA-only。
  loss_scale:
    vla: 1.0
  freeze_modules: ''
  #######
  max_grad_norm: 1.0
  weight_decay: 0.0
  logging_frequency: 10
  gradient_clipping: 1.0
  gradient_accumulation_steps: 8
  gradient_checkpointing: true
  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08
