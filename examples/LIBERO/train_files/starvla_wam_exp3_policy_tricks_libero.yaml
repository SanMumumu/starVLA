#######
# 中文注释：exp3 = WAM policy + tricks（在 exp2 只-policy 基础上加 behavior-1k trick）。
# 与 exp2 对照：看 correlated noise + multi-step FM 对 policy 的增益。
# tasks 只给 policy；action_model.use_correlated_noise=true + flow_matching_steps=20。
# correlated noise 的 Σ-Cholesky 由 trainer 启动时从数据估计并注入（gated on use_correlated_noise）。
#######
run_id: starvla_wam_exp3_policy_tricks
run_root_dir: /horizon-bucket/robot_lab/users/sen.wang-labs/starVLA/outputs/starvla_wam_libero
seed: 42
wandb_entity: your_wandb_entity
wandb_project: starvla_wam_libero
is_debug: false
version_id: "0.21"

framework:
  name: QwenGR00T
  qwenvl:
    base_vlm: /horizon-bucket/robot_lab/users/sen.wang-labs/starVLA/CKPTS/Qwen3-VL-4B-Instruct/
    attn_implementation: sdpa
    enable_gradient_checkpointing: true
    vl_hidden_dim: 2048
    max_text_length: 256
  wam:
    enabled: true
    placeholder_token: "<ACT_PH>"
    dino_loss_weight: 1.0
  #######
  # 中文注释：exp3 同样只有 policy（trick 作用在 action head，不需要世界模型范式）。
  tasks:
    weights:
      policy: 1.0
  #######
  dino:
    name: dinov3_vits16
    hf_model_id: facebook/dinov3-vits16-pretrain-lvd1689m
    repo_or_dir: /horizon-bucket/robot_lab/users/sen.wang-labs/starVLA/CKPTS/dinov3_repo
    weights: /horizon-bucket/robot_lab/users/sen.wang-labs/starVLA/CKPTS/dinov3-vits16-pretrain-lvd1689m/
    loader: auto
    image_size: 224
    patch_size: 16
    embed_dim: 384
    future_view_keys: ["video.primary_image", "observation.images.image", "primary_image", "agentview"]
    stats_path: null
    load_live_backbone: false
    dino_pool: 1
  action_model:
    action_model_type: DiT-B
    action_dim: 7
    state_dim: 7
    action_horizon: 8
    n_action_query: 32
    #######
    # 中文注释：exp3 tricks 开——correlated noise（β=0.5）+ multi-step FM（20，behavior-1k 用 15 适当增大）。
    use_correlated_noise: true
    correlation_beta: 0.5
    flow_matching_steps: 20
    #######
    add_pos_embed: true
    max_seq_len: 1024
    num_inference_timesteps: 10
    num_timestep_buckets: 1000
    noise_beta_alpha: 1.5
    noise_beta_beta: 1.0
    noise_s: 0.999
    repeated_diffusion_steps: 1
    diffusion_model_cfg:
      cross_attention_dim: 2048
      dropout: 0.1
      final_dropout: true
      interleave_self_attention: true
      norm_type: ada_norm
      num_layers: 24
      num_attention_heads: 12
      attention_head_dim: 64
      output_dim: 768
      positional_embeddings: null
  visual_model:
    d_dino: 384
    n_query: 196
    n_flow_query: 64
    max_image_queries: 256
    hidden_size: 1024
    cross_attention_dim: 2048
    num_attention_heads: 16
    attention_head_dim: 64
    num_layers: 12
    dropout: 0.1
    add_pos_embed: true
    max_seq_len: 1024
    num_inference_timesteps: 6
    patch_weighting: change

datasets:
  vla_data:
    dataset_py: jointflow
    data_root_dir: /horizon-bucket/robot_lab/users/sen.wang-labs/starVLA/DATA/LEBERO/libero
    data_mix: libero_all
    action_type: delta_qpos
    sequential_step_sampling: false
    include_state: false
    CoT_prompt: "Your task is {instruction}. To identify the key objects for your task. Locate their bounding boxes in [x1,y1,x2,y2] format."
    per_device_batch_size: 8
    load_all_data_for_training: true
    video_backend: torchvision_av
    online_dino: true
    world_model:
      future_stride: 8

trainer:
  max_train_steps: 100000
  num_warmup_steps: 5000
  save_interval: 10000
  eval_interval: 1000000
  learning_rate:
    base: 2.5e-05
    qwen_vl_interface: 1.0e-05
    action_model: 1.0e-04
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-06
  loss_scale:
    vla: 1.0
  freeze_modules: ''
  max_grad_norm: 1.0
  weight_decay: 0.0
  logging_frequency: 100
  gradient_clipping: 1.0
  gradient_accumulation_steps: 8
  gradient_checkpointing: true
  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08
