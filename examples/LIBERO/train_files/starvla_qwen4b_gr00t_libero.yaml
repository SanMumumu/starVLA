#######
# 中文注释：官方 QwenGR00T 基线（纯 VLA + 全量FT）——Qwen3-VL-4B + GR00T flow-matching action head 原生路径。
# 不开 jointflow/wam；单一 LIBERO VLA 数据（dataset_py=lerobot_datasets，原生 GR00T 数据管线）；
# backbone 不冻结（全量训）+ 梯度检查点。作为 jointflow(query-mask)/wam 的公平对照基线。
# 与 starvla_cotrain_libero.yaml 的 VLA 部分对齐，去掉 VLM cotrain 与 backbone 冻结。
#######
run_id: starvla_qwen4b_gr00t
run_root_dir: /horizon-bucket/robot_lab/users/sen.wang-labs/starVLA/outputs/starvla_qwen4b_gr00t
seed: 42
wandb_entity: your_wandb_entity
wandb_project: starvla_qwen4b_gr00t
is_debug: false
version_id: "0.21"

framework:
  name: QwenGR00T
  qwenvl:
    base_vlm: /horizon-bucket/robot_lab/users/sen.wang-labs/starVLA/CKPTS/Qwen3-VL-4B-Instruct/
    attn_implementation: flash_attention_2
    #######
    # 中文注释：这是安全默认值；AIDI baseline experiment 会在显存足够时覆盖为 false 以减少重算提速。
    # trainer.gradient_checkpointing 是 dead flag，真正生效的开关在这里。
    enable_gradient_checkpointing: true
    #######
    vl_hidden_dim: 2048
    max_text_length: 256
  action_model:
    action_dim: 7
    state_dim: 7
    action_horizon: 8
    #######
    # 中文注释：显式写出训练采样次数，避免吃 QwenGR00T 默认 8 导致 action DiT batch 被放大 8 倍。
    # 需要严格对比默认多噪声采样时，可在 AIDI 里 export AIDI_BASELINE_REPEATED_DIFFUSION_STEPS=8。
    repeated_diffusion_steps: 1
    #######

datasets:
  vla_data:
    dataset_py: lerobot_datasets
    data_root_dir: /horizon-bucket/robot_lab/users/sen.wang-labs/starVLA/DATA/LEBERO/libero
    data_mix: libero_all
    action_type: delta_qpos
    sequential_step_sampling: false
    #######
    # 中文注释：baseline 训练显式不喂 state，和官方 LIBERO 测评路径保持一致；
    # server 即使收到 eval client 的 raw state，也会按 config 丢弃，避免 state 分支 train/eval 失配。
    include_state: false
    #######
    CoT_prompt: "Your task is {instruction}. To identify the key objects for your task. Locate their bounding boxes in [x1,y1,x2,y2] format."
    per_device_batch_size: 8
    load_all_data_for_training: true
    video_backend: torchvision_av

trainer:
  max_train_steps: 100000
  num_warmup_steps: 5000
  save_interval: 5000
  #######
  # 中文注释：走独立 LIBERO server 评测，关 in-loop eval。
  eval_interval: 1000000
  #######
  learning_rate:
    base: 2.5e-05
    qwen_vl_interface: 1.0e-05
    action_model: 1.0e-04
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-06
  #######
  # 中文注释：backbone 不冻结，全量训；VLA-only（无 VLM cotrain，无 vlm loss_scale）。
  freeze_modules: ''
  loss_scale:
    vla: 1.0
  #######
  max_grad_norm: 1.0
  weight_decay: 0.0
  logging_frequency: 10
  gradient_clipping: 1.0
  gradient_accumulation_steps: 8
  gradient_checkpointing: true
  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08