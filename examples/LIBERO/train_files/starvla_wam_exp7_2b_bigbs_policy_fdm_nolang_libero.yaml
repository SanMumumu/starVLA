#######
# 中文注释：exp7 = exp5（2B + tricks + 大 batch + policy）+ FDM（**Δdino** 世界模型分支,**无语言**）。
# 三组对照 {exp7 / exp8 / exp9}（监督 target 固定为 Δdino,只变「有没有动作条件」/「有没有世界模型」）:
#   exp7 = FDM:有动作条件 act_ctx → 预测 **Δdino**
#   exp8 = Passive:无动作条件     → 预测 **Δdino**(同 target!)
#   exp9 = 无世界模型(policy only) 基线
# 共同点:2B/bigbs/tricks、Δdino target、世界模型分支去语言(world_model_no_language)、辅助权重 0.2;policy 分支永远带语言。
# exp7 vs exp8 **单变量只差「动作条件 act_ctx」**(target 都 Δdino)→ 干净回答「动作能否塑造更好表征」(用户意图)。
#######
run_id: starvla_wam_exp7_2b_bigbs_policy_fdm_nolang
run_root_dir: /horizon-bucket/robot_lab/users/sen.wang-labs/starVLA/outputs/starvla_wam_libero_w_grad
seed: 42
wandb_entity: your_wandb_entity
wandb_project: starvla_wam_libero_w_grad
is_debug: false
version_id: "0.21"

framework:
  name: QwenGR00T
  qwenvl:
    base_vlm: /horizon-bucket/robot_lab/users/sen.wang-labs/starVLA/CKPTS/Qwen3-VL-2B-Instruct/
    attn_implementation: sdpa
    enable_gradient_checkpointing: true
    vl_hidden_dim: 2048
    max_text_length: 256
  wam:
    enabled: true
    placeholder_token: "<ACT_PH>"
    dino_loss_weight: 0.01
    #######
    # 中文注释：FDM 预测 Δdino（未来-当前,见 _wam_forward;残差会按通道归一化到≈单位方差）——给定动作预测特征"变化"。
    fdm_delta_dino: true
    # 世界模型分支(fdm)去语言:prompt 只 image + flow 占位,不含指令。policy 分支照常带语言。
    world_model_no_language: true
    #######
  #######
  # 中文注释：exp7 = policy + fdm（flow-query ⊕ act_ctx → 预测 Δdino）。fdm 权重 0.2(辅助塑造表征,核心 policy)。
  tasks:
    weights:
      policy: 1.0
      fdm: 0.2
  #######
  dino:
    name: dinov3_vits16
    hf_model_id: facebook/dinov3-vits16-pretrain-lvd1689m
    repo_or_dir: /horizon-bucket/robot_lab/users/sen.wang-labs/starVLA/CKPTS/dinov3_repo
    weights: /horizon-bucket/robot_lab/users/sen.wang-labs/starVLA/CKPTS/dinov3-vits16-pretrain-lvd1689m/
    loader: auto
    image_size: 224
    patch_size: 16
    embed_dim: 384
    future_view_keys: ["video.primary_image", "observation.images.image", "primary_image", "agentview"]
    stats_path: null
    load_live_backbone: false
    dino_pool: 1
  action_model:
    action_model_type: DiT-B
    action_dim: 7
    state_dim: 7
    action_horizon: 8
    n_action_query: 32
    #######
    # 中文注释：exp6 tricks 开（与 exp5 一致）——correlated noise（β=0.5）+ multi-step FM（20）。
    use_correlated_noise: true
    correlation_beta: 0.5
    flow_matching_steps: 20
    #######
    add_pos_embed: true
    max_seq_len: 1024
    num_inference_timesteps: 10
    num_timestep_buckets: 1000
    noise_beta_alpha: 1.5
    noise_beta_beta: 1.0
    noise_s: 0.999
    repeated_diffusion_steps: 1
    diffusion_model_cfg:
      cross_attention_dim: 2048
      dropout: 0.2    # 与 gr00t baseline 同结构(原 0.1)
      final_dropout: true
      interleave_self_attention: true
      norm_type: ada_norm
      num_layers: 16    # 与 gr00t baseline 同结构(原 24)
      num_attention_heads: 12
      attention_head_dim: 64
      output_dim: 1024    # 与 gr00t baseline 同结构(原 768)
      positional_embeddings: null
  visual_model:
    d_dino: 384
    n_query: 196
    n_flow_query: 64
    max_image_queries: 256
    hidden_size: 1024
    cross_attention_dim: 2048
    num_attention_heads: 16
    attention_head_dim: 64
    num_layers: 12
    dropout: 0.1
    add_pos_embed: true
    max_seq_len: 1024
    num_inference_timesteps: 6
    patch_weighting: change

datasets:
  vla_data:
    dataset_py: jointflow
    data_root_dir: /horizon-bucket/robot_lab/users/sen.wang-labs/starVLA/DATA/LEBERO/libero
    data_mix: libero_all
    action_type: delta_qpos
    sequential_step_sampling: false
    include_state: false
    CoT_prompt: "Your task is {instruction}. To identify the key objects for your task. Locate their bounding boxes in [x1,y1,x2,y2] format."
    #######
    # 中文注释：大 batch——与 exp5 一致 per_device=16（2B 显存富裕）。
    per_device_batch_size: 16
    #######
    load_all_data_for_training: true
    video_backend: torchvision_av
    online_dino: true
    dino_target_latents: true    # hybrid: 在线出 raw 图给 Qwen 原生视觉 + 读预存 DINO latent 当世界模型 target(省在线抽取)
    world_model:
      future_stride: 8

trainer:
  #######
  # 中文注释：与 exp5 一致——大 batch ~50k 即等量，设 60000 多留 ~10k 饱和测试（不强求整除）。
  max_train_steps: 60000
  num_warmup_steps: 3000
  save_interval: 5000
  #######
  eval_interval: 1000000
  learning_rate:
    base: 2.5e-05
    qwen_vl_interface: 1.0e-05
    action_model: 5.0e-05    # 稳定性修复: action head lr 1e-4→5e-5(发散组件是 action head)
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-06
  loss_scale:
    vla: 1.0
  freeze_modules: ''
  max_grad_norm: 1.0
  weight_decay: 0.0
  logging_frequency: 100
  log_grad_norms: true    # 梯度记录总开关(per-task grad_norm_{total,shared,head}/<task>)；不需要看时改 false
  gradient_clipping: 1.0
  gradient_accumulation_steps: 8
  gradient_checkpointing: true
  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08