# Maintained LIBERO Rynn H8 recipe with official StarVLA separate views.
# Current primary + wrist observations each stay 224x224 and retain their full
# DINO grids (2 x 14x14 = 392 tokens). The future target is only the primary
# camera and also stays full resolution at 14x14 (196 tokens). Global batch is
# 128 for 50K steps.

run_id: rynn_h8_dino_fullres
run_root_dir: /horizon-bucket/robot_lab/users/sen.wang-labs/starVLA/outputs/starvla_libero
seed: 42
wandb_entity: axi-the-cat
wandb_project: starVLA_Libero
is_debug: false
version_id: "0.21"

framework:
  name: QwenWorldActionMoT
  enable_world_action_mot: true

  qwenvl:
    base_vlm: /horizon-bucket/robot_lab/users/sen.wang-labs/starVLA/CKPTS/rynnbrain1.1-2B/
    attn_implementation: sdpa
    require_attn_implementation: true
    enable_gradient_checkpointing: true
    enable_thinking: false
    vl_hidden_dim: 2048
    truncate_vlm_layers: 0

  planner:
    num_world_queries: 16
    num_action_queries: 8
    world_placeholder_token: "<WORLD_PLAN>"
    action_placeholder_token: "<ACTION_PLAN>"
    text_supervision:
      enabled: false

  world_action_mot:
    architecture: causal_dino_mot
    interaction_mode: base
    world_attention_mask_mode: first_frame_causal
    world_hidden_size: 512
    action_hidden_size: 1024
    world_ffn_dim: 2048
    action_ffn_dim: 4096
    num_layers: 30
    num_attention_heads: 24
    attention_head_dim: 128
    layerwise_planner_coupling: false
    norm_eps: 1.0e-06
    time_frequency_dim: 256
    # Future primary-camera target: 224x224 / patch16 = 14x14.
    world_grid_height: 14
    world_grid_width: 14
    max_world_tokens: 196
    num_world_views: 1
    # Official StarVLA current observation: primary + wrist, kept separate.
    num_current_world_views: 2
    enable_gradient_checkpointing: true
    world_train_shift: 5.0
    world_infer_shift: 5.0
    world_num_train_timesteps: 1000
    action_train_shift: 5.0
    action_infer_shift: 5.0
    action_num_train_timesteps: 1000
    num_inference_timesteps: 20
    action_prediction_type: velocity
    action_velocity_target: noise_minus_clean
    jit_t_eps: 0.05
    repeated_diffusion_steps: 1
    action_loss_weight: 1.0
    world_loss_weight: 1.0
    text_loss_weight: 0.0

  dino:
    name: dinov3_vitb16
    model_size: base
    hf_model_id: /horizon-bucket/robot_lab/users/sen.wang-labs/starVLA/CKPTS/DINO-B/
    repo_or_dir: facebookresearch/dinov3
    weights: /horizon-bucket/robot_lab/users/sen.wang-labs/starVLA/CKPTS/DINO-B/
    loader: hf
    # Official StarVLA processes primary and wrist as separate 224x224 images.
    image_size: [224, 224]
    # Future supervision uses only the square primary camera.
    future_image_size: [224, 224]
    patch_size: 16
    embed_dim: 768
    stats_path: null
    load_live_backbone: true
    force_online: true
    # Future primary-camera denoising target: keep all 14x14 (196 tokens).
    dino_pool: 1
    # Clean current prefix: no pooling, preserve 2 x 14x14 (392 tokens).
    current_dino_pool: null

  action_model:
    action_dim: 7
    state_dim: 0
    action_horizon: 8

datasets:
  vla_data:
    dataset_py: jointflow
    data_root_dir: /horizon-bucket/robot_lab/users/sen.wang-labs/starVLA/DATA/LEBERO/libero
    data_mix: libero_all
    # Match official StarVLA: primary and wrist are independent image inputs.
    image_layout: separate_views
    # Predict only the future primary/third-person camera.
    future_target_view_keys:
      - video.primary_image
    future_obs_image_size: [224, 224]
    include_state: false
    action_type: delta_qpos
    # LIBERO LeRobot files already store delta-qpos labels; do not delta them twice.
    action_mode: abs
    action_horizon: 8
    world_model:
      future_stride: 8
    future_valid_requires_full_stride: true
    decode_future_video: true
    online_dino: true
    dino_target_latents: false
    text_annotations:
      enabled: false
    sequential_step_sampling: false
    CoT_prompt: "Your task is {instruction}. To identify the key objects for your task. Locate their bounding boxes in [x1,y1,x2,y2] format."
    balance_dataset_weights: false
    balance_trajectory_weights: false
    per_device_batch_size: 8
    load_all_data_for_training: true
    obs_image_size: [224, 224]
    video_backend: torchvision_av
    num_workers: 16
    prefetch_factor: 4
    pin_memory: true
    persistent_workers: true

trainer:
  seed_before_model_init: true
  # 8 micro-batch x 16 GPUs x 1 accumulation step = global 128.
  expected_global_batch_size: 128
  max_train_steps: 50000
  num_warmup_steps: 3000
  save_interval: 5000
  eval_interval: 100000
  world_validation:
    enabled: false
  pretrained_checkpoint: null
  is_resume: false
  save_full_training_state: true
  learning_rate:
    base: 2.5e-05
    qwen_vl_interface: 1.0e-05
    action_plan_queries: 1.0e-04
    world_plan_queries: 1.0e-04
    action_model: 5.0e-05
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-06
  freeze_modules: ""
  loss_scale:
    vla: 1.0
  max_grad_norm: 1.0
  weight_decay: 0.0
  logging_frequency: 100
  log_grad_norms: false
  log_global_grad_norm: true
  deepspeed_skip_unused_param_anchors: true
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1
  gradient_checkpointing: true
  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08
