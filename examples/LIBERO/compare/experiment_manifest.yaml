m0_baseline:
  run_id: cmp_m0_baseline
  framework:
    tasks: {weights: {policy: 1.0, passive: 0.0}}
    wam:
      guidance: {enabled: false, prompt_mode: action_only, mode: none, signal: none}

m0q_dual_query_control:
  run_id: cmp_m0q_dual_query_control
  framework:
    wam:
      guidance: {enabled: true, prompt_mode: dual_query, mode: none, signal: none}

m1_1_hfuture_concat:
  run_id: cmp_m1_1_hfuture_concat
  framework:
    wam:
      guidance: {enabled: true, prompt_mode: dual_query, mode: concat, signal: h_future}

m1_2_zpred_concat:
  run_id: cmp_m1_2_zpred_concat
  framework:
    wam:
      world_target: absolute
      guidance:
        enabled: true
        prompt_mode: dual_query
        mode: concat
        signal: z_pred
        bridge_source: predicted
        detach_world: true

m1_3_dzpred_concat:
  run_id: cmp_m1_3_dzpred_concat
  framework:
    wam:
      world_target: delta
      guidance:
        enabled: true
        prompt_mode: dual_query
        mode: concat
        signal: delta_z_pred
        bridge_source: predicted
        detach_world: true

m3_qformer_best:
  run_id: cmp_m3_qformer_best
  framework:
    wam:
      guidance:
        enabled: true
        prompt_mode: dual_query
        mode: qformer
        signal: z_pred
        n_world_tokens: 64
        qformer_layers: 2
        detach_world: true

warmup_oracle_absolute:
  run_id: cmp_warmup_oracle_absolute
  framework:
    wam:
      world_target: absolute
      guidance:
        enabled: true
        prompt_mode: dual_query
        mode: concat
        signal: z_pred
        bridge_source: oracle
        detach_world: true
        oracle_ratio: 1.0

warmup_oracle_delta:
  run_id: cmp_warmup_oracle_delta
  framework:
    wam:
      world_target: delta
      guidance:
        enabled: true
        prompt_mode: dual_query
        mode: concat
        signal: delta_z_pred
        bridge_source: oracle
        detach_world: true
        oracle_ratio: 1.0

warmup_predicted_absolute:  # Stage2：bridge=predicted, detach_world（load Stage1 ckpt）
  run_id: cmp_warmup_predicted_absolute
  framework:
    wam:
      world_target: absolute
      guidance:
        enabled: true
        prompt_mode: dual_query
        mode: concat
        signal: z_pred
        bridge_source: predicted
        detach_world: true

warmup_predicted_delta:
  run_id: cmp_warmup_predicted_delta
  framework:
    wam:
      world_target: delta
      guidance:
        enabled: true
        prompt_mode: dual_query
        mode: concat
        signal: delta_z_pred
        bridge_source: predicted
        detach_world: true

m4_alternate_best:
