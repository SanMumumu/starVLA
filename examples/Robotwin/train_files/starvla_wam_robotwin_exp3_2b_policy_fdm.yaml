#######
# 中文注释：RoboTwin exp3 = exp2（2B + tricks + 大 batch + policy）再加 FDM 范式（预测 delta-DINO）。
# 与 exp2 对照：单变量只差「加前向动力学监督(act-query 打 action + flow-query 在动作条件下预测 delta-DINO)」对 policy 的增益。
# tasks：policy 1.0 + fdm 0.5（passive/idm 不给权重→不采样）。
# wam.fdm_delta_dino=true：fdm target = DINO(image_1) - DINO(image_0)（差分，只学动作引起的特征变化），见 QwenGR00T._wam_forward。
# 其余（2B / 大 batch / tricks / lr / steps / data_mix=robotwin_all_50 / horizon32）与 exp2 完全一致，保证单变量对照。
# 注意：exp3 fdm 会在线跑 DINO backbone(image_1) 算 target，显存比 exp2 高；若 OOM 把 per_device 降到 4（grad_accum 保持 1）。
#######
run_id: starvla_wam_robotwin_exp3_2b_policy_fdm
run_root_dir: /horizon-bucket/robot_lab/users/sen.wang-labs/starVLA/outputs/starvla_robotwin
seed: 42
wandb_entity: your_wandb_entity
wandb_project: starvla_robotwin
is_debug: false
version_id: "0.21"

framework:
  name: QwenGR00T
  qwenvl:
    base_vlm: /horizon-bucket/robot_lab/users/sen.wang-labs/starVLA/CKPTS/Qwen3-VL-2B-Instruct/
    attn_implementation: sdpa
    enable_gradient_checkpointing: true
    vl_hidden_dim: 2048
    max_text_length: 256
  wam:
    enabled: true
    placeholder_token: "<ACT_PH>"
    dino_loss_weight: 1.0
    #######
    # 中文注释：fdm 预测 delta-DINO（未来-当前），而非绝对未来 DINO。
    fdm_delta_dino: true
    #######
  #######
  # 中文注释：exp3 = policy + fdm（act-query 打 action；flow-query 在动作条件下预测 delta-DINO）。
  tasks:
    weights:
      policy: 1.0
      fdm: 0.5
  #######
  dino:
    name: dinov3_vitl16
    model_size: large    # DINO-L(与集群预存 ΔDINO-L latent 对齐);d_dino 自动 1024;offline 不加载 backbone
    hf_model_id: facebook/dinov3-vits16-pretrain-lvd1689m
    repo_or_dir: /horizon-bucket/robot_lab/users/sen.wang-labs/starVLA/CKPTS/dinov3_repo
    weights: /horizon-bucket/robot_lab/users/sen.wang-labs/starVLA/CKPTS/dinov3-vits16-pretrain-lvd1689m/
    loader: auto
    image_size: 224
    patch_size: 16
    embed_dim: 1024
    future_view_keys: ["video.cam_high", "video.cam_left_wrist", "video.cam_right_wrist"]
    stats_path: null
    load_live_backbone: false
    dino_pool: 1
  action_model:
    action_model_type: DiT-B
    action_dim: 14
    state_dim: 14
    action_horizon: 32
    n_action_query: 32
    #######
    # 中文注释：tricks 开——correlated noise（β=0.5）+ multi-step FM（20）。
    use_correlated_noise: true
    correlation_beta: 0.5
    flow_matching_steps: 20
    #######
    add_pos_embed: true
    max_seq_len: 1024
    num_inference_timesteps: 10
    num_timestep_buckets: 1000
    noise_beta_alpha: 1.5
    noise_beta_beta: 1.0
    noise_s: 0.999
    repeated_diffusion_steps: 1
    diffusion_model_cfg:
      cross_attention_dim: 2048
      dropout: 0.2    # 与 gr00t baseline 同结构(原 0.1)
      final_dropout: true
      interleave_self_attention: true
      norm_type: ada_norm
      num_layers: 16    # 与 gr00t baseline 同结构(原 24)
      num_attention_heads: 12
      attention_head_dim: 64
      output_dim: 1024    # 与 gr00t baseline 同结构(原 768)
      positional_embeddings: null
  visual_model:
    d_dino: 384
    n_query: 196
    n_flow_query: 64
    max_image_queries: 256
    hidden_size: 1024
    cross_attention_dim: 2048
    num_attention_heads: 16
    attention_head_dim: 64
    num_layers: 12
    dropout: 0.1
    add_pos_embed: true
    max_seq_len: 1024
    num_inference_timesteps: 6
    patch_weighting: change

datasets:
  vla_data:
    dataset_py: jointflow
    data_root_dir: /horizon-bucket/robot_lab/users/sen.wang-labs/starVLA/DATA/RoboTwin   # ⚠️ 按实际 RoboTwin 根目录改
    data_mix: robotwin_all_50         # 与 OFT baseline 同任务集 + horizon32（robot_type=robotwin32）
    action_type: abs_qpos             # 中文注释：RoboTwin 绝对关节角（对齐 OFT）
    action_mode: abs
    action_horizon: 32                # 中文注释：jointflow dataset 读 data_cfg.action_horizon(默认8)，必须 = 模型 32
    sequential_step_sampling: false
    include_state: false
    obs_image_size: [224, 224]
    CoT_prompt: "Your task is {instruction}. To identify the key objects for your task. Locate their bounding boxes in [x1,y1,x2,y2] format."
    #######
    # 中文注释：2B per_device 提到 8（fdm 在线跑 DINO 更吃显存，OOM 就降到 4）；大 batch 靠多机多卡（global=per_device×总卡，grad_accum=1）。
    per_device_batch_size: 8
    #######
    load_all_data_for_training: false
    video_backend: torchvision_av
    #######
    # 中文注释：⚠️64卡集群 OOM 防护。默认 num_workers=16 → 64×16=1024 worker 会把节点 CPU 内存打爆,
    # worker 被 OOM-killed(报 "DataLoader worker killed by signal: Killed")→该 rank 退出→其它 rank NCCL 连带崩。
    num_workers: 1
    prefetch_factor: 1
    pin_memory: false
    persistent_workers: false
    #######
    online_dino: true
    dino_target_latents: true    # hybrid: 在线出 raw 图给 Qwen 原生视觉 + 读预存 DINO latent 当世界模型 target(省在线抽取)
    world_model:
      future_stride: 32             # 中文注释：对齐 horizon=32
trainer:
  #######
  # 中文注释：大 batch → 步数比 baseline 少 + 留饱和测试（不强求整除）；save 频繁挑饱和点。
  max_train_steps: 30000
  num_warmup_steps: 3000
  save_interval: 5000
  #######
  eval_interval: 1000000
  learning_rate:
    base: 1.0e-05               # 中文注释：对齐 OFT baseline
    qwen_vl_interface: 1.0e-05
    action_model: 5.0e-05    # 稳定性修复: action head lr 1e-4→5e-5(发散组件是 action head)
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 5.0e-07
  loss_scale:
    vla: 1.0
  freeze_modules: ''
  max_grad_norm: 1.0
  weight_decay: 0.0
  logging_frequency: 100
  gradient_clipping: 1.0
  #######
  # 中文注释：多机训练 grad_accum=1（大 batch 靠多卡，global = per_device × 总卡数）。
  gradient_accumulation_steps: 1
  #######
  gradient_checkpointing: true
  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-06    # 稳定性修复: Adam eps 1e-8→1e-6(bf16 近收敛梯度极小→Adam 更新爆炸,是 action_loss 收敛后飞了的主因)
    weight_decay: 0.01    # 稳定性修复: wd 1e-8→0.01,抑制全量FT后期漂移出收敛盆地
