#######
# Checkpoint-compatible IID recipe for the original StarVLA-on-FastWAM run.
#
# FastWAM contract: 50 Hz, 32 actions, current 14-D proprio, one 384x320
# head+wrist composite, release-order vectors, global z-score, seeded 99/1
# episode split, global-frame sampling without replacement, and pad masking.
#######

run_id: starvla_qwengroot_robotwin_fastwam_jitx_iid
run_root_dir: /horizon-bucket/robot_lab/users/sen.wang-labs/starVLA/outputs/starvla_robotwin
seed: 42
wandb_entity: axi-the-cat
wandb_project: starVLA_Robotwin
is_debug: false
version_id: "0.21"

framework:
  name: QwenGR00T

  qwenvl:
    base_vlm: /horizon-bucket/robot_lab/users/sen.wang-labs/starVLA/CKPTS/Qwen3-VL-2B-Instruct/
    attn_implementation: flash_attention_2
    enable_gradient_checkpointing: true
    vl_hidden_dim: 2048

  action_model:
    action_model_type: DiT-LAWAM
    action_hidden_dim: 1024
    hidden_size: 1024
    add_pos_embed: true
    max_seq_len: 1024

    action_dim: 14
    state_dim: 14
    action_horizon: 32

    repeated_diffusion_steps: 2
    noise_beta_alpha: 1.5
    noise_beta_beta: 1.0
    noise_s: 0.999
    num_timestep_buckets: 1000
    num_inference_timesteps: 10
    prediction_type: jit_x
    jit_t_eps: 0.05
    flow_time_sampling: gr00t

    use_correlated_noise: false
    num_target_vision_tokens: 32

    diffusion_model_cfg:
      cross_attention_dim: 2048
      dropout: 0.2
      final_dropout: true
      interleave_self_attention: true
      norm_type: ada_norm
      num_layers: 16
      output_dim: 1024
      positional_embeddings: null

datasets:
  vla_data:
    dataset_py: lerobot_datasets
    data_root_dir: /horizon-bucket/robot_lab/users/haoyi.jiang/repos/fastwam/robotwin2.0-fastwam
    data_mix: robotwin_fastwam
    lerobot_version: v2.0
    fastwam_dataset_stats_path: /horizon-bucket/robot_lab/users/haoyi.jiang/repos/fastwam/robotwin2.0-fastwam/dataset_stats.json
    fastwam_expected_fps: 50
    fastwam_val_fraction: 0.01
    fastwam_split: train
    fastwam_split_seed: 42
    fastwam_direct_frame_sampling: true

    include_state: true
    action_type: abs_qpos
    action_mode: abs
    sequential_step_sampling: false
    balance_dataset_weights: false
    balance_trajectory_weights: false
    # 8 machines x 8 GPUs x 12 samples = global batch 768.
    per_device_batch_size: 12

    load_all_data_for_training: true
    # PIL size is [width, height]; the FastWAM composite is exactly 320x384.
    obs_image_size: [320, 384]
    video_backend: pyav
    # Four loader workers per rank = 32 processes/node on an 8-GPU node.
    num_workers: 4
    prefetch_factor: 2
    pin_memory: true
    persistent_workers: false

trainer:
  # Controlled baseline/WAM ablation: initialize the policy from seed 42
  # before model construction (the historical trainer seeded only afterward).
  seed_before_model_init: true
  expected_global_batch_size: 768
  max_train_steps: 80000
  num_warmup_steps: 2000
  save_interval: 10000
  action_eval_enabled: true
  eval_interval: 1000

  learning_rate:
    base: 1.0e-05
    qwen_vl_interface: 1.0e-05
    action_model: 1.0e-04

  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 5.0e-07

  freeze_modules: ''

  loss_scale:
    vla: 1.0

  max_grad_norm: 1.0
  weight_decay: 0.0
  logging_frequency: 200
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1

  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08
