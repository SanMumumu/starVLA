#######
# Physically-Aligned Action--World Co-Flow for the official FastWAM RoboTwin
# v2.1 release.  This is a new model type; it does not enable or alter WAM.
#
# Physical blocks at the release's verified 50 Hz frame/action clock:
#   [current context + Z0] -> [A1:16,Z16] -> [A17:32,Z32]
#
# World targets are frozen, fixed-mean, multi-layer Qwen3-VL patch latents on a
# deterministic 4x8 grid.  The trainable model predicts in that fixed space.
#######

run_id: robotwin_action_world_coflow_qwenlatent_h32_iid_100k
run_root_dir: /horizon-bucket/robot_lab/users/sen.wang-labs/starVLA/outputs/starvla_action_world_coflow_robotwin
seed: 42
wandb_entity: axi-the-cat
wandb_project: starVLA_Robotwin
is_debug: false
version_id: "0.21"

framework:
  name: QwenActionWorldCoFlow
  enable_action_world_coflow: true

  qwenvl:
    base_vlm: /horizon-bucket/robot_lab/users/sen.wang-labs/starVLA/CKPTS/Qwen3-VL-2B-Instruct/
    attn_implementation: flash_attention_2
    enable_gradient_checkpointing: true
    vl_hidden_dim: 2048

  action_model:
    action_dim: 14
    state_dim: 14
    action_horizon: 32
    repeated_diffusion_steps: 1
    noise_beta_alpha: 1.5
    noise_beta_beta: 1.0
    noise_s: 0.999
    num_timestep_buckets: 1000
    prediction_type: jit_x
    jit_t_eps: 0.05
    flow_time_sampling: gr00t
    use_correlated_noise: false

  action_world_coflow:
    segment_boundaries: [16, 32]
    future_strides: [16, 32]

    freeze_qwen_vision_encoder: true
    world_feature_layer_strategy: evenly_spaced
    world_feature_num_layers: 4
    world_feature_layers: null
    world_layer_fusion_type: fixed_mean
    fixed_layer_weights: null
    world_feature_normalization: layernorm

    world_spatial_pool_type: adaptive_avg_pool2d
    world_token_grid: [4, 8]
    num_world_tokens: 32

    # Exact Qantara state-axis convention: Brownian bridge input and clean-x
    # delta prediction/re-projection.  This is not a Gaussian world diffusion.
    world_bridge_type: qantara_brownian_bridge
    bridge_noise_scale: 1.0
    world_prediction_type: qantara_x_delta
    action_timestep_sampling: starvla_gr00t
    world_timestep_sampling: qantara_monotone

    # Policy is the primary objective.  Each world endpoint receives half of
    # lambda_world, keeping early world gradients useful without dominating
    # late action optimization.
    action_loss_weight: 1.0
    world_loss_weight: 0.01
    z16_loss_weight: 0.5
    z32_loss_weight: 0.5

    # Stage-2 receives GT/predicted-detached Z16 early, then predicted-detached
    # only after 40k optimizer steps.  Evaluation is always predicted-only.
    intermediate_state_source: scheduled
    predicted_z16_detach: true
    predicted_action_prefix_detach: true
    z16_teacher_ratio_start: 1.0
    z16_teacher_ratio_end: 0.0
    z16_teacher_decay_steps: 40000

    # Ratios are validated to sum exactly to one.  joint=independent interior;
    # diagonal=tied action/world time.  policy has no clean future input.
    noise_plane_sampling:
      policy_ratio: 0.35
      forward_ratio: 0.20
      inverse_ratio: 0.10
      joint_ratio: 0.15
      diagonal_ratio: 0.20

    action_inference_steps: 10
    world_inference_steps: 10

    hidden_size: 1024
    num_layers: 12
    num_attention_heads: 16
    mlp_ratio: 4.0
    dropout: 0.1
    time_frequency_dim: 256
    enable_gradient_checkpointing: true
    log_attention_statistics: true

datasets:
  vla_data:
    dataset_py: lerobot_datasets
    data_root_dir: /horizon-bucket/robot_lab/users/haoyi.jiang/repos/fastwam/robotwin2.0-fastwam
    data_mix: robotwin_fastwam
    lerobot_version: v2.0
    fastwam_dataset_stats_path: /horizon-bucket/robot_lab/users/haoyi.jiang/repos/fastwam/robotwin2.0-fastwam/dataset_stats.json
    fastwam_expected_fps: 50
    fastwam_val_fraction: 0.01
    fastwam_split: train
    fastwam_split_seed: 42
    fastwam_direct_frame_sampling: true

    fastwam_wam_targets: false
    fastwam_action_world_coflow_targets: true
    fastwam_coflow_future_strides: [16, 32]

    include_state: true
    action_type: abs_qpos
    action_mode: abs
    sequential_step_sampling: false
    balance_dataset_weights: false
    balance_trajectory_weights: false
    # Same direct micro-batch requested for the 6x8-GPU RoboTwin experiments;
    # no gradient accumulation (global batch = 6*8*16 = 768).
    per_device_batch_size: 16

    load_all_data_for_training: true
    image_layout: fastwam_composite
    composite_source_view_keys: [video.cam_high, video.cam_left_wrist, video.cam_right_wrist]
    composite_view_key: video.robotwin_composite
    obs_image_size: [320, 384]
    video_backend: pyav
    num_workers: 8
    prefetch_factor: 2
    pin_memory: true
    persistent_workers: false

trainer:
  max_train_steps: 100000
  num_warmup_steps: 4000
  save_interval: 10000
  eval_interval: 5000
  pretrained_checkpoint: null
  is_resume: false

  learning_rate:
    base: 1.0e-05
    qwen_vl_interface: 1.0e-05
    action_model: 1.0e-04

  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 5.0e-07

  # Vision freezing is owned by the opt-in model and verified before optimizer
  # creation; language/context remains trainable at the Qwen LR above.
  freeze_modules: ''
  loss_scale:
    vla: 1.0
  max_grad_norm: 1.0
  weight_decay: 0.0
  logging_frequency: 100
  log_grad_norms: false
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1

  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08
