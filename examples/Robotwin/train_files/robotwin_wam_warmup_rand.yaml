#######
# RoboTwin WAM M5 oracle warmup —— RAND 设定 (chunk=16).
#
# rand 设定：每个任务 50 干净 + 500 随机数据（data_mix=robotwin_all_16，100 个任务 = 50 Clean + 50 Randomized）。
# 与 robotwin_wam_warmup_clean.yaml 单变量只差数据集（clean+rand vs clean-only）。
# Stage 1 保持最终 M5 拓扑 (dual_xattn)，给 world branch 喂 GT 未来 DINO-L latent（oracle bridge），
# passive loss 并行训练 world head。action chunk=16（与 OFT baseline / clean warmup 对齐）。
#######
run_id: robotwin_wam_m5_warmup_rand_h16
run_root_dir: /horizon-bucket/robot_lab/users/sen.wang-labs/starVLA/outputs/starvla_wam_robotwin
seed: 42
wandb_entity: your_wandb_entity
wandb_project: starvla_wam_robotwin
is_debug: false
version_id: "0.21"

framework:
  name: QwenGR00T
  qwenvl:
    base_vlm: /horizon-bucket/robot_lab/users/sen.wang-labs/starVLA/CKPTS/Qwen3-VL-2B-Instruct/
    attn_implementation: sdpa
    enable_gradient_checkpointing: true
    vl_hidden_dim: 2048
    max_text_length: 256
  wam:
    enabled: true
    placeholder_token: "<ACT_PH>"
    dino_loss_weight: 0.1
    world_target: absolute
    guidance:
      enabled: true
      mode: dual_xattn
      signal: z_pred
      prompt_mode: dual_query
      bridge_source: oracle
      detach_world: true
      oracle_ratio: 1.0
      n_world_tokens: 64
      qformer_layers: 2
      fusion_layers: 2
      gate_init: 0.0
      world_dropout: 0.0
      include_context_in_world_memory: true
      world_eval_mode: correct
  tasks:
    weights:
      policy: 1.0
      passive: 1.0
  dino:
    name: dinov3_vitl16
    model_size: large
    hf_model_id: facebook/dinov3-vits16-pretrain-lvd1689m
    repo_or_dir: /horizon-bucket/robot_lab/users/sen.wang-labs/starVLA/CKPTS/dinov3_repo
    weights: /horizon-bucket/robot_lab/users/sen.wang-labs/starVLA/CKPTS/dinov3-vits16-pretrain-lvd1689m/
    loader: auto
    image_size: 224
    patch_size: 16
    embed_dim: 1024
    future_view_keys: ["video.cam_high", "video.cam_left_wrist", "video.cam_right_wrist"]
    stats_path: null
    load_live_backbone: false
    dino_pool: 1
  action_model:
    action_model_type: DiT-B
    action_dim: 14
    state_dim: 14
    action_horizon: 16
    n_action_query: 32
    # correlated noise：启动时 rank0 估动作协方差 Cholesky。已改为"只读 action 不解码视频"
    # (joint_dataset.py: compute_action_correlation_cholesky + read_action_only,只碰 parquet + 逐样本跳坏样本)，
    # 不再逐样本 PyAV 解码 → 不再撞启动 barrier(train_starvla.py:749) 的 30min NCCL 超时。
    use_correlated_noise: true
    correlation_beta: 0.5
    correlation_num_samples: 512
    flow_matching_steps: 4
    add_pos_embed: true
    max_seq_len: 1024
    num_inference_timesteps: 10
    num_timestep_buckets: 1000
    noise_beta_alpha: 1.5
    noise_beta_beta: 1.0
    noise_s: 0.999
    repeated_diffusion_steps: 1
    diffusion_model_cfg:
      cross_attention_dim: 2048
      dropout: 0.2
      final_dropout: true
      interleave_self_attention: true
      norm_type: ada_norm
      num_layers: 16
      num_attention_heads: 12
      attention_head_dim: 64
      output_dim: 1024
      positional_embeddings: null
  visual_model:
    d_dino: 1024
    n_query: 196
    n_flow_query: 64
    max_image_queries: 256
    hidden_size: 1024
    cross_attention_dim: 2048
    num_attention_heads: 16
    attention_head_dim: 64
    num_layers: 12
    dropout: 0.1
    add_pos_embed: true
    max_seq_len: 1024
    num_inference_timesteps: 6
    patch_weighting: change

datasets:
  vla_data:
    dataset_py: jointflow
    data_root_dir: /horizon-bucket/robot_lab/users/sen.wang-labs/starVLA/DATA/RoboTwin
    data_mix: robotwin_all_16
    action_type: abs_qpos
    action_mode: abs
    action_horizon: 16
    sequential_step_sampling: false
    # RobotWin 局部帧级均匀采样（仅本 config 设，不改全局默认 False）：
    #   dataset=按目录总帧数成比例（clean 50 : rand 500 = 1:10 自然比例）；
    #   trajectory=目录内按轨迹帧数成比例 → 帧级均匀，长时序任务被更多采样。
    balance_dataset_weights: true
    balance_trajectory_weights: true
    include_state: false
    obs_image_size: [224, 224]
    CoT_prompt: "Your task is {instruction}. To identify the key objects for your task. Locate their bounding boxes in [x1,y1,x2,y2] format."
    per_device_batch_size: 4
    load_all_data_for_training: false
    video_backend: torchvision_av
    # 提速：jointflow 每样本=3视角×2帧视频解码+episode latent 读取，num_workers=1 藏不住 → 40-60s/it。
    # ⚠️ 8 worker 首跑 step78 节点 OOM→ncclRemoteError（episode latent 缓存 per-dataset×worker 膨胀）。
    # 已在 joint_dataset.py 修（逐样本清缓存 + 下面 dino_target_latent_views 只读 view0），并回到验证过的
    # 4 worker/rank=32/节点。若仍慢再试 6/8；若再见 worker killed/OOM 先查节点内存。
    num_workers: 4
    prefetch_factor: 2
    pin_memory: false
    persistent_workers: true
    online_dino: true
    dino_target_latents: true
    # 只读 cam_high 的 latent（模型 target 只取 z[:,0]，其余视角白读）：bucket I/O 与 worker 内存 3× 减。
    dino_target_latent_views: [0]
    world_model:
      future_stride: 16

trainer:
  max_train_steps: 150000
  num_warmup_steps: 5000
  save_interval: 10000
  eval_interval: 1000
  pretrained_checkpoint: null
  is_resume: false
  learning_rate:
    base: 1.0e-05
    qwen_vl_interface: 1.0e-05
    action_model: 1.0e-04
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 5.0e-07
  loss_scale:
    vla: 1.0
  freeze_modules: ''
  max_grad_norm: 1.0
  weight_decay: 0.0
  logging_frequency: 50
  log_grad_norms: true
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1
  gradient_checkpointing: true
  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08
