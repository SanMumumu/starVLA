#######
# 中文注释：RoboTwin baseline = QwenOFT（Qwen3-VL-4B 原生视觉 + DiT 动作头），**纯 VLA**（关掉官方 abs 配置的 llava co-train）。
# 与官方 starvla_cotrain_robotwin_abs.yaml 同构，只做三处对齐 WAM 对照的改动：
#   ① 去掉 vlm_data（co-train）→ 纯 VLA，单变量只差「OFT 动作头 vs WAM-metaquery」；
#   ② data_mix=robotwin_all_16（与 WAM 同任务集 + horizon 16；OFT 的 horizon 由 DataConfig.action_indices 定，
#      故用新增的 robotwin16 robot_type，见 dataloader/gr00t_lerobot/{data_config,mixtures}.py）；
#   ③ action_horizon=16（原官方 abs 是 50）。主要用于验证训练脚本正确性 + 对齐 WAM chunk=16。
# 其余（lr/optimizer/action head/dino backbone/image size）保持官方 OFT 设定，方便控制变量。
# ⚠️ 提交前确认 data_root_dir / base_vlm 路径按实际环境改。
#######
run_id: starvla_qwenoft_robotwin
run_root_dir: /horizon-bucket/robot_lab/users/sen.wang-labs/starVLA/outputs/starvla_robotwin
seed: 42
wandb_entity: axi-the-cat
wandb_project: starVLA_Robotwin
is_debug: false
version_id: "0.21"

framework:
  name: QwenOFT
  qwenvl:
    base_vlm: /horizon-bucket/robot_lab/users/sen.wang-labs/starVLA/CKPTS/Qwen3-VL-4B-Instruct/
    attn_implementation: flash_attention_2
    vl_hidden_dim: 2048
  dino:
    dino_backbone: dinov2_vits14
  action_model:
    action_model_type: DiT-B
    hidden_size: 1024
    add_pos_embed: True
    max_seq_len: 1024
    action_dim: 14
    state_dim: 14
    action_horizon: 16        # 中文注释：与 WAM 实验统一 chunk=16（官方 abs 原为 50）
    repeated_diffusion_steps: 8
    noise_beta_alpha: 1.5
    noise_beta_beta: 1.0
    noise_s: 0.999
    num_timestep_buckets: 1000
    num_inference_timesteps: 4
    num_target_vision_tokens: 32
    diffusion_model_cfg:
      dropout: 0.2
      final_dropout: true
      interleave_self_attention: true
      norm_type: "ada_norm"
      num_layers: 16
      output_dim: 2560
      positional_embeddings: null

datasets:
  #######
  # 中文注释：纯 VLA——删掉官方 abs 里的 vlm_data(llava co-train) 段。
  vla_data:
    dataset_py: lerobot_datasets
    include_state: false
    data_root_dir: /horizon-bucket/robot_lab/users/sen.wang-labs/starVLA/DATA/RoboTwin   # ⚠️ 按实际 RoboTwin 根目录改
    data_mix: robotwin_all_16     # 100 任务 @ horizon16（robot_type=robotwin16；lerobot 通路 horizon=action_indices=16，与 action_horizon 对齐）
    action_type: abs_qpos
    action_mode: abs
    sequential_step_sampling: False
    #######
    # 中文注释：RobotWin 局部帧级均匀采样（仅本 config 设，不改全局默认 False）。
    #   balance_dataset_weights=true  → 目录按总帧数成比例（clean 50 : rand 500 = 1:10 自然比例）。
    #   balance_trajectory_weights=true → 目录内轨迹按帧数成比例 → 帧级均匀，长时序任务被更多采样。
    balance_dataset_weights: true
    balance_trajectory_weights: true
    #######
    per_device_batch_size: 4      # 中文注释：官方 4B robotwin 设定（baseline 不开大 batch）
    load_all_data_for_training: true
    obs_image_size: [224, 224]
    video_backend: pyav
  #######

trainer:
  max_train_steps: 50000
  num_warmup_steps: 5000
  save_interval: 5000
  #######
  # 中文注释：RoboTwin 走外部 sim 评测（examples/Robotwin/eval_files），关 in-loop eval。
  eval_interval: 1000000
  #######
  learning_rate:
    base: 1.0e-05
    qwen_vl_interface: 1.0e-05
    action_model: 5.0e-05    # 稳定性修复: action head lr 1e-4→5e-5(发散组件是 action head)
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 5.0e-07
  freeze_modules: ''
  #######
  # 中文注释：纯 VLA——只留 vla loss（官方 abs 是 vla 1.0 + vlm 0.1）。
  loss_scale:
    vla: 1.0
  #######
  max_grad_norm: 1.0
  weight_decay: 0.0
  logging_frequency: 100
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1
  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-06    # 稳定性修复: Adam eps 1e-8→1e-6(bf16 近收敛梯度极小→Adam 更新爆炸,是 action_loss 收敛后飞了的主因)
    weight_decay: 0.01    # 稳定性修复: wd 1e-8→0.01,抑制全量FT后期漂移出收敛盆地
