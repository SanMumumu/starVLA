#######
# RoboTwin baseline = QwenGR00T（Qwen3-VL-4B + GR00T flow-matching / DiT action head）
#
# 重要说明：
# 1. 官方没有公开 RoboTwin-QwenGR00T 的完整 YAML / ckpt。
# 2. 本配置是“RoboTwin OFT 官方实际训练 recipe”迁移到 QwenGR00T：
#    - 6×8 GPU
#    - per_device_batch_size=4
#    - max_train_steps=150000
#    - robotwin_all_50
#    - abs_qpos / abs
#    - action_horizon=50
#    - co-train VLM loss 0.1
# 3. 不使用 gradient accumulation；6 台 8 卡机直接 global batch = 48×4 = 192。
# 4. 当前 QwenGR00T.py 里 DINO 不参与该框架 forward，因此这里不写 dino 配置。
#######

run_id: starvla_qwengroot_robotwin
run_root_dir: /horizon-bucket/robot_lab/users/sen.wang-labs/starVLA/outputs/starvla_robotwin
seed: 42
wandb_entity: axi-the-cat
wandb_project: starVLA_Robotwin
is_debug: false
version_id: "0.21"

framework:
  name: QwenGR00T

  qwenvl:
    base_vlm: /horizon-bucket/robot_lab/users/sen.wang-labs/starVLA/CKPTS/Qwen3-VL-2B-Instruct/
    attn_implementation: flash_attention_2
    vl_hidden_dim: 2048

  action_model:
    action_model_type: DiT-B

    action_hidden_dim: 1024
    hidden_size: 1024

    add_pos_embed: True
    max_seq_len: 1024

    action_dim: 14
    state_dim: 14
    action_horizon: 50

    repeated_diffusion_steps: 8
    noise_beta_alpha: 1.5
    noise_beta_beta: 1.0
    noise_s: 0.999
    num_timestep_buckets: 1000
    num_inference_timesteps: 4
    num_target_vision_tokens: 32

    diffusion_model_cfg:
      cross_attention_dim: 2048
      dropout: 0.2
      final_dropout: true
      interleave_self_attention: true
      norm_type: "ada_norm"
      num_layers: 16
      output_dim: 1024
      positional_embeddings: null

datasets:
  # #######
  # # 保留 VLM co-train：这是更接近 StarVLA 官方 co-train recipe 的 GR00T 版本。
  # # 如果你要做 pure VLA ablation，再删掉整个 vlm_data，并把 loss_scale 只留 vla:1.0。
  # #######
  # vlm_data:
  #   dataset_py: vlm_datasets
  #   dataformat: llava_json
  #   dataset_use: asv2_conversation_en,asv2_detailed_description_en,asv2_region_captioning_en,coco_internvl_longcap_en,coco_karpathy_train_567_en,coco_negative_gpt4o_en,coco_poetry_zh,coco_rem_en_zh,cocorem_exist_yorn_en,cocotextv2_en,cocotextv2_gpt4o_en,okvqa_en,refcoco_grounding_aug_en,refcoco_grounding_en,tallyqa_coco_en,toloka_grounding_aug_en,vqav2_en,vsr_en
  #   eval_dataset: aokvqa_cauldron_llava_format
  #   data_flatten: false
  #   base_interval: 2
  #   max_pixels: 50176
  #   min_pixels: 784
  #   model_max_length: 2048
  #   model_type: qwen2.5vl
  #   per_device_batch_size: 4

  vla_data:
    dataset_py: lerobot_datasets
    include_state: false
    data_root_dir: /horizon-bucket/robot_lab/users/sen.wang-labs/starVLA/DATA/RoboTwin
    data_mix: robotwin_all_50
    action_type: abs_qpos
    action_mode: abs
    sequential_step_sampling: false
    per_device_batch_size: 4

    load_all_data_for_training: true
    obs_image_size: [224, 224]
    video_backend: pyav

    # 不显式打开 balance_dataset_weights / balance_trajectory_weights。
    # 默认 false/false，即 folder-balanced sampling，更接近官方/HF OFT 行为。
    # balance_dataset_weights: false
    # balance_trajectory_weights: false

trainer:
  max_train_steps: 300000
  num_warmup_steps: 5000
  save_interval: 10000

  eval_interval: 1000

  learning_rate:
    base: 1.0e-05
    qwen_vl_interface: 1.0e-05
    action_model: 1.0e-04

  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 5.0e-07

  freeze_modules: ''

  loss_scale:
    vla: 1.0
    # vlm: 0.1

  max_grad_norm: 1.0
  weight_decay: 0.0
  logging_frequency: 50
  gradient_clipping: 1.0

  gradient_accumulation_steps: 1

  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08