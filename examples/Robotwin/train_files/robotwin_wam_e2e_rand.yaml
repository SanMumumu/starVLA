#######
# FastWAM joint end-to-end experiment: full 27,500-episode release.
#
# Each batch optimizes L_action + 0.01 * L_world. Native causal order permits
# ACT -> FUTURE (policy-query-conditioned world prediction) but forbids FUTURE -> ACT.
# Post-query chat-template tokens are excluded so the action branch consumes
# only predicted future DINO tokens from step 0; GT future tokens are targets
# for L_world and are never action inputs.  The dual-xattn gate is zero-init.
# Action-loss gradients into the world branch are held at zero through step
# 10k, then linearly ramped to full strength at step 30k.
#
# FastWAM ABI: 50 Hz, z-score, H=32, one 320x384 three-camera composite,
# no proprio, release-order actions, effective per-GPU batch 16.
#######

run_id: robotwin_wam_m5_fastwam_e2e_rand_h32_jitx_iidnoise_jointonly_100k
run_root_dir: /horizon-bucket/robot_lab/users/sen.wang-labs/starVLA/outputs/starvla_wam_robotwin
seed: 42
wandb_entity: axi-the-cat
wandb_project: starVLA_Robotwin
is_debug: false
version_id: "0.21"

framework:
  name: QwenGR00T

  qwenvl:
    base_vlm: /horizon-bucket/robot_lab/users/sen.wang-labs/starVLA/CKPTS/Qwen3-VL-2B-Instruct/
    attn_implementation: flash_attention_2
    enable_gradient_checkpointing: true
    vl_hidden_dim: 2048

  wam:
    enabled: true
    action_gradient_checkpointing: true
    visual_gradient_checkpointing: true
    placeholder_token: "<ACT_PH>"
    # raw world 0.1 -> 0.01 becomes weighted 1e-3 -> 1e-4, matching the
    # requested policy-loss scale without letting the auxiliary loss dominate.
    dino_loss_weight: 0.01
    world_target: absolute
    guidance:
      enabled: true
      mode: dual_xattn
      signal: z_pred
      prompt_mode: dual_query
      # Keep causal ACT -> FUTURE conditioning, but prevent assistant/template
      # suffix tokens from carrying FUTURE back into action memory around gate.
      exclude_post_query_context: true
      bridge_source: predicted
      detach_world: false
      oracle_ratio: 0.0
      n_world_tokens: 64
      qformer_layers: 2
      fusion_layers: 2
      gate_init: 0.0
      world_dropout: 0.0
      include_context_in_world_memory: true
      action_world_gradient_ramp:
        enabled: true
        start_step: 10000
        end_step: 30000
        start_scale: 0.0
        end_scale: 1.0
      world_eval_mode: correct

  # A single task means no policy/passive sampling or alternating steps.
  tasks:
    weights:
      # Defense in depth for old code that recursively merged the framework
      # default policy=1 into YAML task weights.
      policy: 0.0
      joint_e2e: 1.0

  dino:
    name: dinov3_vitl16
    model_size: large
    hf_model_id: /horizon-bucket/robot_lab/users/sen.wang-labs/starVLA/CKPTS/DINO/
    weights: /horizon-bucket/robot_lab/users/sen.wang-labs/starVLA/CKPTS/DINO/
    loader: hf
    image_size: [384, 320]
    patch_size: 16
    embed_dim: 1024
    future_view_keys: ["video.robotwin_composite"]
    stats_path: null
    load_live_backbone: false
    dino_pool: 1

  action_model:
    action_model_type: DiT-LAWAM
    action_hidden_dim: 1024
    hidden_size: 1024
    add_pos_embed: true
    max_seq_len: 1024

    action_dim: 14
    state_dim: 14
    action_horizon: 32

    repeated_diffusion_steps: 2
    noise_beta_alpha: 1.5
    noise_beta_beta: 1.0
    noise_s: 0.999
    num_timestep_buckets: 1000
    num_inference_timesteps: 10
    prediction_type: jit_x
    jit_t_eps: 0.05
    flow_time_sampling: gr00t

    # E2E ablation deliberately drops correlation noise; train and inference
    # both use the action head's native IID Gaussian noise.
    use_correlated_noise: false
    num_target_vision_tokens: 32

    diffusion_model_cfg:
      cross_attention_dim: 2048
      dropout: 0.2
      final_dropout: true
      interleave_self_attention: true
      norm_type: ada_norm
      num_layers: 16
      output_dim: 1024
      positional_embeddings: null

  visual_model:
    d_dino: 1024
    n_flow_query: 64
    max_target_tokens: 480
    hidden_size: 1024
    cross_attention_dim: 2048
    num_attention_heads: 16
    attention_head_dim: 64
    num_layers: 12
    dropout: 0.1
    add_pos_embed: true
    max_seq_len: 480
    num_inference_timesteps: 6
    patch_weighting: change

datasets:
  vla_data:
    dataset_py: lerobot_datasets
    data_root_dir: /horizon-bucket/robot_lab/users/haoyi.jiang/repos/fastwam/robotwin2.0-fastwam
    data_mix: robotwin_fastwam
    lerobot_version: v2.0
    fastwam_dataset_stats_path: /horizon-bucket/robot_lab/users/haoyi.jiang/repos/fastwam/robotwin2.0-fastwam/dataset_stats.json
    fastwam_expected_fps: 50
    fastwam_val_fraction: 0.01
    fastwam_split: train
    fastwam_split_seed: 42
    fastwam_direct_frame_sampling: true

    fastwam_wam_targets: true
    fastwam_wam_target: composite
    fastwam_future_stride: 32

    include_state: false
    action_type: abs_qpos
    action_mode: abs
    sequential_step_sampling: false
    balance_dataset_weights: false
    balance_trajectory_weights: false
    # The 6x8-GPU allocation can fit the baseline batch directly: 16 samples
    # per GPU, with no gradient accumulation (global batch = 6 * 8 * 16 = 768).
    per_device_batch_size: 16

    load_all_data_for_training: true
    obs_image_size: [320, 384]
    video_backend: pyav
    num_workers: 8
    prefetch_factor: 2
    pin_memory: true
    persistent_workers: false

trainer:
  max_train_steps: 100000
  num_warmup_steps: 4000
  save_interval: 10000
  eval_interval: 1000
  pretrained_checkpoint: null
  is_resume: false

  learning_rate:
    base: 1.0e-05
    qwen_vl_interface: 1.0e-05
    action_model: 1.0e-04
    wam_visual_head: 5.0e-05
    world_adapter: 1.0e-04

  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 5.0e-07

  freeze_modules: ''

  loss_scale:
    vla: 1.0

  max_grad_norm: 1.0
  weight_decay: 0.0
  logging_frequency: 200
  log_grad_norms: false
  deepspeed_skip_unused_param_anchors: true
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1

  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08
