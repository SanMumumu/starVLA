  learning_rate:
    base: 1.0e-05
    # Synthetic selectors claim gate/adapter parameters before action_model.
    world_gates: 1.0e-04
    world_to_action_adapters: 1.0e-04
    action_queries: 1.0e-05
    action_model: 1.0e-05

  lr_scheduler_type: constant_with_warmup
  scheduler_specific_kwargs: {}
  freeze_modules: 'qwen_vl_interface,wam_visual_head,wam_state_ctx,wam_act_ctx,future_dino_queries'
  loss_scale:
