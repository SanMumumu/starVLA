#######
# Stage 2/2 (rand/full): frozen-world gated policy fine-tuning for 20k.
#
# Frozen: Qwen, future query, World-DiT, state/action world conditioners.
# Trained: action query + Action-DiT core + world-to-action adapter/cross-attn
# + zero-initialized gates. One AdamW uses the requested LR groups; a short
# 500-step linear warmup opens the new path smoothly without another stage.
#######

run_id: robotwin_wam_m5_fastwam_isolatedqueries_gate_ft_rand_state_h32_dinojitx_iid_20k
run_root_dir: /horizon-bucket/robot_lab/users/sen.wang-labs/starVLA/outputs/starvla_wam_robotwin_isolated
seed: 42
wandb_entity: axi-the-cat
wandb_project: starVLA_Robotwin
is_debug: false
version_id: "0.21"

framework:
  name: QwenGR00T

  qwenvl:
    base_vlm: /horizon-bucket/robot_lab/users/sen.wang-labs/starVLA/CKPTS/Qwen3-VL-2B-Instruct/
    attn_implementation: flash_attention_2
    enable_gradient_checkpointing: false
    vl_hidden_dim: 2048

  wam:
    enabled: true
    action_gradient_checkpointing: true
    visual_gradient_checkpointing: false
    placeholder_token: "<ACT_PH>"
    dino_loss_weight: 0.1
    world_target: absolute
    guidance:
      enabled: true
      mode: dual_xattn
      signal: z_pred
      prompt_mode: dual_query
      exclude_post_query_context: true
      bridge_source: predicted
      detach_world: true
      detached_prediction_eval_mode: true
      action_world_bypass: false
      world_to_action_enabled: true
      detach_action_backbone: false
      detach_world_backbone: true
      baseline_action_context: false
      pretraining_aligned_queries: true
      freeze_world_to_action_in_warmup: false
      oracle_ratio: 0.0
      n_world_tokens: 64
      qformer_layers: 2
      fusion_layers: 2
      gate_init: 0.0
      log_gate_openness: true
      world_dropout: 0.0
      world_condition_on_state: true
      include_context_in_action_memory: true
      include_context_in_world_memory: true
      action_world_gradient_ramp:
        enabled: false
        start_step: 0
        end_step: 0
        start_scale: 0.0
        end_scale: 0.0
      world_eval_mode: correct

  tasks:
