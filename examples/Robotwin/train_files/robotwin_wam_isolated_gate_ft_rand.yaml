    pin_memory: true
    persistent_workers: false

trainer:
  expected_global_batch_size: 768
  wam_two_stage_phase: gate_ft
  wam_two_stage_recipe: isolated_queries_v4
  max_train_steps: 20000
  num_warmup_steps: 500
  save_interval: 10000
  action_eval_enabled: false
  eval_interval: 5000
  world_validation:
    enabled: true
    interval: 5000
    task: policy
    per_device_batch_size: 2
    num_workers: 2
    num_batches: 4
    num_samples: 1
    num_inference_timesteps: 10
    seed: 2027
  pretrained_checkpoint: /horizon-bucket/robot_lab/users/sen.wang-labs/starVLA/outputs/starvla_wam_robotwin_isolated/robotwin_wam_m5_fastwam_isolatedqueries_warmup_rand_state_h32_dinojitx_iid_80k/final_model/pytorch_model.pt
  is_resume: false
  reset_world_gates_after_pretrained_load: true
