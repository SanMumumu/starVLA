#######
# Action-first H16 Co-Flow with an opt-in asymmetric sparse MoT.
#
# The attention operation remains shared so context, action, and world tokens
# exchange information.  Norms and FFNs are modality-specific and execute only
# their assigned tokens.  The action-only FFN expert itself meets or exceeds
# the released DiT-LAWAM action-head parameter budget without counting shared
# attention; the world FFN is one third of the action FFN.  The model contains
# exactly one H16 action--future bridge and closes the loop after execution.
#######

run_id: robotwin_action_world_coflow_better_mot_h16_iid_100k
run_root_dir: /horizon-bucket/robot_lab/users/sen.wang-labs/starVLA/outputs/starvla_action_world_coflow_robotwin_better
seed: 42
wandb_entity: axi-the-cat
wandb_project: starVLA_Robotwin
is_debug: false
version_id: "0.21"

framework:
  name: QwenActionWorldCoFlow
  enable_action_world_coflow: true

  qwenvl:
    base_vlm: /horizon-bucket/robot_lab/users/sen.wang-labs/starVLA/CKPTS/Qwen3-VL-2B-Instruct/
    attn_implementation: flash_attention_2
    enable_gradient_checkpointing: true
    vl_hidden_dim: 2048

  action_model:
    action_dim: 14
    state_dim: 14
    action_horizon: 16
    # Co-Flow samples its joint time plane directly; this legacy schema field
    # is intentionally fixed at one and is not used as an implicit repeat.
    repeated_diffusion_steps: 1
    noise_beta_alpha: 1.5
    noise_beta_beta: 1.0
    noise_s: 0.999
    num_timestep_buckets: 1000
    prediction_type: jit_x
    jit_t_eps: 0.05
    flow_time_sampling: gr00t
    use_correlated_noise: false

  action_world_coflow:
    freeze_qwen_vision_encoder: true
    world_feature_layer_strategy: evenly_spaced
    world_feature_num_layers: 4
    world_feature_layers: null
    world_layer_fusion_type: fixed_mean
    fixed_layer_weights: null
    world_feature_normalization: layernorm

    world_spatial_pool_type: adaptive_avg_pool2d
    world_token_grid: [4, 8]
    num_world_tokens: 32

    world_bridge_type: qantara_brownian_bridge
    bridge_noise_scale: 1.0
    world_prediction_type: qantara_x_delta
    action_timestep_sampling: starvla_gr00t
    world_timestep_sampling: qantara_monotone

    action_loss_weight: 1.0
    world_loss_weight: 0.1
    world_loss_schedule:
      enabled: true
      transition_step: 50000
      before_weight: 0.1
      after_weight: 0.025

    # Ninety-five percent of samples carry action supervision.  Policy and
    # diagonal paths dominate because they are the two deployment ablations.
    noise_plane_sampling:
      policy_ratio: 0.55
      forward_ratio: 0.05
      inverse_ratio: 0.05
      joint_ratio: 0.10
      diagonal_ratio: 0.25

    action_inference_steps: 10
    world_inference_steps: 10
    default_inference_mode: policy

    hidden_size: 1024
    # Match the reference FastWAM DiT-LAWAM depth instead of compensating for
    # a shallower action path with one excessively wide expert.
    num_layers: 16
    num_attention_heads: 16
    mlp_ratio: 4.0
    dropout: 0.1
    time_frequency_dim: 256
    enable_gradient_checkpointing: true
    log_attention_statistics: true

    # TOKEN_CONTEXT, TOKEN_ACTION, TOKEN_WORLD use independent FFN experts.
    # (8 / 3) gives the world expert one-third of the action FFN capacity.
    # The minimum is the exact parameter count of the full reference FastWAM
    # DiT-LAWAM action head.  This stricter check compares only the private
    # action expert and does not borrow the shared-attention parameter count.
    mot:
      enabled: true
      sparse_routing: true
      context_mlp_ratio: 2.0
      action_mlp_ratio: 8.0
      world_mlp_ratio: 2.6666666666666665
      minimum_action_expert_parameters: 262673422
      target_world_to_action_expert_ratio: 0.3333333333333333

datasets:
  vla_data:
    dataset_py: lerobot_datasets
    data_root_dir: /horizon-bucket/robot_lab/users/haoyi.jiang/repos/fastwam/robotwin2.0-fastwam
    data_mix: robotwin_fastwam_h16
    lerobot_version: v2.0
    fastwam_dataset_stats_path: /horizon-bucket/robot_lab/users/haoyi.jiang/repos/fastwam/robotwin2.0-fastwam/dataset_stats.json
    fastwam_expected_fps: 50
    fastwam_val_fraction: 0.01
    fastwam_split: train
    fastwam_split_seed: 42
    fastwam_direct_frame_sampling: true

    fastwam_wam_targets: false
    fastwam_action_world_coflow_targets: true

    include_state: true
    action_type: abs_qpos
    action_mode: abs
    sequential_step_sampling: false
    balance_dataset_weights: false
    balance_trajectory_weights: false
    per_device_batch_size: 12

    load_all_data_for_training: true
    image_layout: fastwam_composite
    composite_source_view_keys: [video.cam_high, video.cam_left_wrist, video.cam_right_wrist]
    composite_view_key: video.robotwin_composite
    obs_image_size: [320, 384]
    video_backend: pyav
    num_workers: 4
    prefetch_factor: 2
    pin_memory: true
    persistent_workers: false

trainer:
  expected_global_batch_size: 768
  max_train_steps: 100000
  num_warmup_steps: 4000
  save_interval: 10000
  eval_interval: 5000
  pretrained_checkpoint: null
  is_resume: false

  learning_rate:
    base: 1.0e-05
    qwen_vl_interface: 1.0e-05
    action_model: 1.0e-04

  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 5.0e-07

  freeze_modules: ''
  loss_scale:
    vla: 1.0
  max_grad_norm: 1.0
  weight_decay: 0.0
  logging_frequency: 100
  log_global_grad_norm: true
  log_grad_norms: false
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1

  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08
