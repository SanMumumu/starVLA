#######
# FastWAM corrnoise strict ablation: FastWAM Clean subset, predicted gated bridge.
#
# Shared baseline contract: 50 Hz, z-score, action chunk 32, one 320x384
# FastWAM composite, current 14-D proprio, release-order actions, batch 16,
# seeded 99/1 split and without-replacement global-frame sampling.
# Added components are limited to the future-composite DINO-L prediction head
# and its gated dual-cross-attention injection into the action DiT.
#######

run_id: robotwin_wam_m5_fastwam_gate_clean2clean_h32_jitx_corrnoise
run_root_dir: /horizon-bucket/robot_lab/users/sen.wang-labs/starVLA/outputs/starvla_wam_robotwin
seed: 42
wandb_entity: axi-the-cat
wandb_project: starVLA_Robotwin
is_debug: false
version_id: "0.21"

framework:
  name: QwenGR00T

  qwenvl:
    base_vlm: /horizon-bucket/robot_lab/users/sen.wang-labs/starVLA/CKPTS/Qwen3-VL-2B-Instruct/
    attn_implementation: flash_attention_2
    enable_gradient_checkpointing: true
    vl_hidden_dim: 2048

  wam:
    enabled: true
    action_gradient_checkpointing: true
    placeholder_token: "<ACT_PH>"
    dino_loss_weight: 0.1
    world_target: absolute
    guidance:
      enabled: true
      mode: dual_xattn
      signal: z_pred
      prompt_mode: dual_query
      bridge_source: predicted
      detach_world: true
      oracle_ratio: 1.0
      n_world_tokens: 64
      qformer_layers: 2
      fusion_layers: 2
      gate_init: 0.0
      world_dropout: 0.0
      include_context_in_world_memory: true
      world_eval_mode: correct

  tasks:
    weights:
      policy: 1.0
      passive: 1.0

  dino:
    name: dinov3_vitl16
    model_size: large
    hf_model_id: /horizon-bucket/robot_lab/users/sen.wang-labs/starVLA/CKPTS/DINO/
    # Complete HF snapshot of facebook/dinov3-vitl16-pretrain-lvd1689m.
    # FastWAM does not ship precomputed DINO targets. The future 384x320
    # three-camera composite is encoded once; the frozen teacher is excluded from checkpoints.
    weights: /horizon-bucket/robot_lab/users/sen.wang-labs/starVLA/CKPTS/DINO/
    loader: hf
    image_size: [384, 320]  # DINO tensor order: [height, width]; preserve the composite exactly.
    patch_size: 16
    embed_dim: 1024
    future_view_keys: ["video.robotwin_composite"]
    stats_path: null
    load_live_backbone: false
    dino_pool: 1

  action_model:
    action_model_type: DiT-LAWAM
    action_hidden_dim: 1024
    hidden_size: 1024
    add_pos_embed: true
    max_seq_len: 1024

    action_dim: 14
    state_dim: 14
    action_horizon: 32

    repeated_diffusion_steps: 2
    noise_beta_alpha: 1.5
    noise_beta_beta: 1.0
    noise_s: 0.999
    num_timestep_buckets: 1000
    num_inference_timesteps: 10
    prediction_type: jit_x
    jit_t_eps: 0.05
    flow_time_sampling: gr00t

    use_correlated_noise: true
    correlation_beta: 0.5
    correlation_num_samples: 4096
    correlation_matrix_type: correlation
    # Reuse the exact baseline matrix; fail instead of silently re-estimating.
    correlation_cholesky_path: /horizon-bucket/robot_lab/users/sen.wang-labs/starVLA/outputs/starvla_robotwin/starvla_qwengroot_robotwin_fastwam_jitx_corrnoise/action_correlation_cholesky.npy
    num_target_vision_tokens: 32

    diffusion_model_cfg:
      cross_attention_dim: 2048
      dropout: 0.2
      final_dropout: true
      interleave_self_attention: true
      norm_type: ada_norm
      num_layers: 16
      output_dim: 1024
      positional_embeddings: null

  visual_model:
    d_dino: 1024
    n_flow_query: 64
    max_target_tokens: 480
    hidden_size: 1024
    cross_attention_dim: 2048
    num_attention_heads: 16
    attention_head_dim: 64
    num_layers: 12
    dropout: 0.1
    add_pos_embed: true
    max_seq_len: 480
    num_inference_timesteps: 6
    patch_weighting: change

datasets:
  vla_data:
    dataset_py: lerobot_datasets
    data_root_dir: /horizon-bucket/robot_lab/users/haoyi.jiang/repos/fastwam/robotwin2.0-fastwam
    data_mix: robotwin_fastwam
    lerobot_version: v2.0
    fastwam_dataset_stats_path: /horizon-bucket/robot_lab/users/haoyi.jiang/repos/fastwam/robotwin2.0-fastwam/dataset_stats.json
    fastwam_expected_fps: 50
    fastwam_val_fraction: 0.01
    fastwam_split: train
    fastwam_split_seed: 42
    fastwam_direct_frame_sampling: true
    fastwam_domain: clean
    fastwam_expected_domain_episodes: 2500
    # Decode all three t+32 views, rebuild the exact FastWAM composite, then
    # encode that single 320x384 future composite with DINO-L.
    fastwam_wam_targets: true
    fastwam_wam_target: composite
    fastwam_future_stride: 32

    include_state: true
    action_type: abs_qpos
    action_mode: abs
    sequential_step_sampling: false
    balance_dataset_weights: false
    balance_trajectory_weights: false
    per_device_batch_size: 16

    load_all_data_for_training: true
    obs_image_size: [320, 384]
    video_backend: pyav
    num_workers: 8
    prefetch_factor: 2
    pin_memory: true
    persistent_workers: false

trainer:
  max_train_steps: 80000
  num_warmup_steps: 2000
  save_interval: 10000
  eval_interval: 1000
  pretrained_checkpoint: /horizon-bucket/robot_lab/users/sen.wang-labs/starVLA/outputs/starvla_wam_robotwin/robotwin_wam_m5_fastwam_warmup_clean_h32_jitx_corrnoise/final_model/pytorch_model.pt
  is_resume: false

  learning_rate:
    base: 1.0e-05
    qwen_vl_interface: 1.0e-05
    action_model: 1.0e-04

  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 5.0e-07

  freeze_modules: ''

  loss_scale:
    vla: 1.0

  max_grad_norm: 1.0
  weight_decay: 0.0
  logging_frequency: 200
  log_grad_norms: false
  deepspeed_skip_unused_param_anchors: true
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1

  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08
