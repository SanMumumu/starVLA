#######
# 中文注释：RoboTwin baseline: QwenOFT pure-VLA, robotwin_all_50 @ horizon32（零编辑提交，backbone 全量训）。科学定义见 aidi/experiments/robotwin_oft_baseline.sh。
# 多机：WORKER_MIN_NUM=WORKER_MAX_NUM=节点数（下面是 4 节点×8卡=32卡，按需改）；
#   grad_accum=1 → global batch = per_device × 总卡数（exp1 4B per_device4→128；exp2/3 2B per_device8→256）。
#   run_aidi.sh 自动按标准 PyTorch 分布式变量(WORLD_SIZE/RANK/MASTER_ADDR/MASTER_PORT)拼 accelerate 多机。
#######
REQUIRED:
  JOB_NAME: "robotwin-oft-baseline-4node"
  JOB_PASSWD: "newk8s666"

  UPLOAD_DIR: "/home/users/sen02.wang-labs/aidi_jobs/starvla_dev"
  PROJECT_ID: "horizon-labs"

  WORKER_MIN_NUM: 2
  WORKER_MAX_NUM: 2
  GPU_PER_WORKER: 8

  RUN_SCRIPTS: "${WORKING_PATH}/run_aidi_rbtw.sh"

OPTIONAL:
  FRAMEWORK: "pytorch"
  TASK_LABEL: "DEV"
  PRIORITY: 5
  DOCKER_IMAGE: "docker.hobot.cc/imagesys/starvla:v2.1"
  WALL_TIME: 20000
  JOB_TYPE: "train"
  REMARK: "RoboTwin baseline: QwenOFT pure-VLA, robotwin_all_50 @ horizon32"
  DATA_SPACE:
    DATA_TYPE: "dmp"
    INPUT: "robot_lab"
    OUTPUT: "robot_lab"
